<div id="app">
  <div id="clarao" aria-hidden="true"></div>

  <!-- ══ INÍCIO: o título boiando na linha d'água ══════════════ -->
  <section class="tela ativa" id="tela-inicio">
    <div class="ceu-sol" aria-hidden="true"></div>
    <div class="canto-som">
      <button class="ico-bt claro" id="bt-som" aria-label="Som"></button>
      <button class="ico-bt claro" id="bt-ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M4.2 7.5l1.9 1.1M17.9 15.4l1.9 1.1M4.2 16.5l1.9-1.1M17.9 8.6l1.9-1.1"/></svg></button>
    </div>
    <svg class="titulo" viewBox="0 0 470 132" role="img" aria-label="Mergulho">
      <defs>
        <clipPath id="t-seco"><rect x="0" y="0" width="470" height="76"/></clipPath>
        <clipPath id="t-molhado"><rect x="0" y="76" width="470" height="56"/></clipPath>
        <filter id="t-ondula" x="-5%" y="-20%" width="110%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.014 0.11" numOctaves="1" seed="4">
            <animate attributeName="baseFrequency" dur="6s" values="0.014 0.11;0.018 0.13;0.014 0.11" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" scale="6"/>
        </filter>
        <linearGradient id="t-agua" x1="0" y1="76" x2="0" y2="122" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#F3FBFF"/><stop offset="1" stop-color="#BDEFEF"/>
        </linearGradient>
      </defs>
      <text class="t-seco" x="235" y="102" text-anchor="middle" clip-path="url(#t-seco)">Mergulho</text>
      <g clip-path="url(#t-molhado)"><text class="t-molhado" x="235" y="102" text-anchor="middle" filter="url(#t-ondula)" fill="url(#t-agua)">Mergulho</text></g>
    </svg>
    <div class="particulas" aria-hidden="true"><i class="bolha-amb" style="left:8%;width:9px;height:9px;animation-duration:13s;animation-delay:-2s"></i><i class="bolha-amb" style="left:22%;width:6px;height:6px;animation-duration:16s;animation-delay:-7s"></i><i class="bolha-amb" style="left:37%;width:11px;height:11px;animation-duration:11s;animation-delay:-4s"></i><i class="bolha-amb" style="left:54%;width:7px;height:7px;animation-duration:15s;animation-delay:-10s"></i><i class="bolha-amb" style="left:69%;width:12px;height:12px;animation-duration:12s;animation-delay:-1s"></i><i class="bolha-amb" style="left:84%;width:8px;height:8px;animation-duration:14s;animation-delay:-6s"></i><i class="bolha-amb" style="left:93%;width:6px;height:6px;animation-duration:17s;animation-delay:-9s"></i></div>
    <div class="raios raios-inicio" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="onda-inicio" aria-hidden="true"></div>
    <div class="inicio-conteudo">
      <p class="subtitulo">Junte três iguais e desça do raso até o fundo do mar.</p>
      <div class="vitrine" aria-hidden="true">
        <svg viewBox="0 0 100 100"><use href="#s0"/></svg>
        <svg viewBox="0 0 100 100"><use href="#s1"/></svg>
        <svg viewBox="0 0 100 100"><use href="#s2"/></svg>
        <svg viewBox="0 0 100 100"><use href="#s3"/></svg>
        <svg viewBox="0 0 100 100"><use href="#s4"/></svg>
        <svg viewBox="0 0 100 100"><use href="#s5"/></svg>
      </div>
      <div class="semana-home" id="semana-home" hidden></div>
      <div class="podio" id="podio" hidden></div>
      <div class="inicio-bts">
        <button class="bt" id="bt-jogar">Mergulhar</button>
        <button class="bt vidro" id="bt-ajuda">Como jogar</button>
        <button class="bt vidro" id="bt-desafio">Desafio da semana</button>
      </div>
      <p class="versao" id="versao" aria-hidden="true"></p>
    </div>
  </section>

  <!-- ══ MAPA: a coluna d'água ═════════════════════════════════ -->
  <section class="tela" id="tela-mapa">
    <div class="topo">
      <button class="ico-bt" id="bt-mapa-volta" aria-label="Voltar ao início"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="moedas"><svg viewBox="0 0 100 100"><use href="#i-moeda"/></svg><span class="n-moedas">0</span></div>
      <div class="placar-estrelas"><svg viewBox="0 0 100 100"><use href="#i-estrela"/></svg><span id="total-estrelas">0</span></div>
      <button class="ico-bt" id="bt-rank" aria-label="Ranking"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/><path d="M12 14v4M9 20h6"/></svg></button>
      <button class="ico-bt" id="bt-loja" aria-label="Loja"><svg viewBox="0 0 24 24"><use href="#i-loja"/></svg></button>
    </div>
    <div class="trilha" id="trilha"><div id="coluna"></div></div>
  </section>

  <!-- ══ JOGO ══════════════════════════════════════════════════ -->
  <section class="tela" id="tela-jogo">
    <div class="hud">
      <div class="hud-topo">
        <button class="ico-bt" id="bt-jogo-volta" aria-label="Voltar ao mapa"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="fase-titulo"><span class="num-fase" id="fase-num">1</span><b id="fase-nome"></b><span id="fase-prof"></span></div>
      </div>
      <div class="painel">
        <div class="hud-linha">
          <div class="objetivo" id="objetivo"></div>
          <div class="movimentos" id="movimentos">
            <div class="fundo"></div>
            <div class="n" id="mov-n">20</div>
            <div class="lb" id="mov-lb">jogadas</div>
          </div>
        </div>
        <div class="pontos-linha">
          <div class="p" id="pontos">0</div>
          <div class="meta" id="meta-texto"></div>
        </div>
        <div class="barra">
          <div class="cheio" id="barra-cheio"></div>
          <div class="marca" id="m1"><svg viewBox="0 0 100 100"><use href="#i-estrela-off"/></svg></div>
          <div class="marca" id="m2"><svg viewBox="0 0 100 100"><use href="#i-estrela-off"/></svg></div>
          <div class="marca" id="m3"><svg viewBox="0 0 100 100"><use href="#i-estrela-off"/></svg></div>
        </div>
      </div>
    </div>
    <div class="area-jogo">
      <div id="mesa">
        <div id="celulas"></div>
        <div id="pecas"></div>
        <div id="faiscas"></div>
        <div class="faixa" id="faixa"></div>
        <div class="combo" id="combo" aria-hidden="true"></div>
      </div>
    </div>
    <div class="barra-poderes">
      <p class="dica-poder" id="dica-poder" hidden></p>
      <div class="poderes" id="poderes"></div>
    </div>
  </section>

  <div id="veu"><div class="cartao" id="cartao"></div></div>
