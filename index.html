  const casco = 'M20 60C20 45 33 37 50 37C67 37 80 45 80 60C80 72 67 80 50 80C33 80 20 72 20 60Z';
  s += pinta(casco, id, pal, m);
  if (m === 1) [[36, 55, 3.2], [50, 48, 3.8], [64, 55, 3.2], [43, 67, 2.6], [57, 67, 2.6]].forEach(q => s += circ(q[0], q[1], q[2], 'fill="' + pal.x + '" opacity=".95"'));
  if (m === 0) s += '<path d="M36 70Q50 76 64 70" fill="none" stroke="' + pal.e + '" stroke-width="2" stroke-linecap="round" opacity=".5"/>';
  if (m === 3) [[38, 56], [50, 50], [62, 56], [50, 65]].forEach(q => s += luzinha(q[0], q[1], 2.4, pal.x, pal.b));
  if (m === 4) [[36, 60], [50, 53], [64, 60], [43, 70], [57, 70]].forEach(q => s += luzinha(q[0], q[1], 2, pal.x, pal.e));
  s += traco('M44 39L42 30', 3.4, linha) + traco('M56 39L58 30', 3.4, linha);
  const olho = m === 4 ? pal.x : '#fff';
  s += circ(42, 28, 4.6, 'fill="' + olho + '" stroke="' + linha + '" stroke-width="1.4"') + circ(58, 28, 4.6, 'fill="' + olho + '" stroke="' + linha + '" stroke-width="1.4"');
  if (m !== 4) s += circ(42.6, 28.6, 2.4, 'fill="#14142A"') + circ(58.6, 28.6, 2.4, 'fill="#14142A"') + circ(41.4, 27, .9, 'fill="#fff"') + circ(57.4, 27, .9, 'fill="#fff"');
  return { defs: tinta(id, pal, m, 40, 44), corpo: s + brilhoSol(m, 40, 47, 10, 4.6, -12) };
}

/* ── 2 · concha em espiral (contorno de náutilo) ───────────── */
function concha(m, id) {
  const pal = PAL[2][m], L = LUZ[m];
  const K = 3.2, b = Math.log(K) / (2 * Math.PI), R = 43, phi0 = Math.PI * 0.86, N = 90;
  const esp = (th, esc) => { const r = R * esc * Math.exp(b * (th - 2 * Math.PI)); const a = phi0 + th; return [r * Math.cos(a), r * Math.sin(a)]; };
  /* contorno: a última volta da espiral, fechada pela boca */
  const bruto = [];
  for (let i = 0; i <= N; i++) bruto.push(esp(i / N * 2 * Math.PI, 1));
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  bruto.forEach(p => { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
  const esc = 88 / Math.max(maxx - minx, maxy - miny), ox = 50 - (minx + maxx) / 2 * esc, oy = 53 - (miny + maxy) / 2 * esc;
  const T = p => [ox + p[0] * esc, oy + p[1] * esc];
  const ptsFora = bruto.map(T);
  let d = 'M' + f1(ptsFora[0][0]) + ' ' + f1(ptsFora[0][1]);
  ptsFora.slice(1).forEach(p => d += 'L' + f1(p[0]) + ' ' + f1(p[1]));
  /* a boca abre para fora num lábio curvo */
  const rm = R * (1 + 1 / K) / 2, am = phi0 + .42, lab = T([rm * 1.1 * Math.cos(am), rm * 1.1 * Math.sin(am)]);
  d += 'Q' + f1(lab[0]) + ' ' + f1(lab[1]) + ' ' + f1(ptsFora[0][0]) + ' ' + f1(ptsFora[0][1]) + 'Z';
  const volta = (esc2, th0, th1, n) => { let q = ''; for (let i = 0; i <= n; i++) { const p = T(esp(th0 + (th1 - th0) * i / n, esc2)); q += (i ? 'L' : 'M') + f1(p[0]) + ' ' + f1(p[1]); } return q; };
  const sutura = volta(1 / K, 0, 2 * Math.PI, 70) + volta(1 / (K * K), 0, 2 * Math.PI, 40);
  const faixa = e2 => volta(1 / K + e2 * (1 - 1 / K), .15, 2 * Math.PI - .1, 70);
  const boca = [T(esp(2 * Math.PI, 1)), T(esp(2 * Math.PI, 1 / K))];

  let s = halo(id, m) + pinta(d, id, pal, m), dec = '';
  const linhaCor = L === 'sol' ? pal.e : pal.c;
  if (m === 0) [.38, .62, .84].forEach(e2 => dec += '<path d="' + faixa(e2) + '" fill="none" stroke="' + pal.x + '" stroke-width="1.7" opacity=".45" stroke-linecap="round"/>');
  if (m === 1) dec += '<path d="' + faixa(.55) + '" fill="none" stroke="' + pal.x + '" stroke-width="5.5" stroke-dasharray="5 5" opacity=".85" stroke-linecap="round"/>' +
                      '<path d="' + faixa(.85) + '" fill="none" stroke="' + pal.x + '" stroke-width="2.4" stroke-dasharray="2 6" opacity=".7" stroke-linecap="round"/>';
  if (m === 2) for (let th = Math.PI * .95; th < 2 * Math.PI - .25; th += .34) {
    const a = T(esp(th, 1)), bq = T(esp(th - .22, .62));
    dec += '<path d="M' + f1(a[0]) + ' ' + f1(a[1]) + 'Q' + f1((a[0] + bq[0]) / 2 + 2) + ' ' + f1((a[1] + bq[1]) / 2) + ' ' + f1(bq[0]) + ' ' + f1(bq[1]) + '" stroke="' + pal.x + '" stroke-width="3.4" stroke-linecap="round" opacity=".88" fill="none"/>';
  }
  if (L !== 'sol') for (let th = .5; th < 2 * Math.PI - .2; th += .52) { /* câmaras do náutilo aparecendo */
    const a = T(esp(th, 1 / K)), bq = T(esp(th + .18, .97));
    dec += '<path d="M' + f1(a[0]) + ' ' + f1(a[1]) + 'Q' + f1((a[0] + bq[0]) / 2) + ' ' + f1((a[1] + bq[1]) / 2 - 1.5) + ' ' + f1(bq[0]) + ' ' + f1(bq[1]) + '" stroke="' + pal.c + '" stroke-width="1.4" opacity="' + (L === 'neon' ? .55 : .45) + '" fill="none"/>';
  }
  dec += '<path d="' + sutura + '" fill="none" stroke="' + linhaCor + '" stroke-width="' + (L === 'neon' ? 2.2 : 2.4) + '" stroke-linecap="round" opacity="' + (L === 'sol' ? .7 : .95) + '"/>';
  { const rm = R * (1 + 1 / K) / 2, am = phi0 + .42, lab = T([rm * 1.1 * Math.cos(am), rm * 1.1 * Math.sin(am)]);
    dec += '<path d="M' + f1(boca[0][0]) + ' ' + f1(boca[0][1]) + 'Q' + f1(lab[0]) + ' ' + f1(lab[1]) + ' ' + f1(boca[1][0]) + ' ' + f1(boca[1][1]) + '" fill="none" stroke="' + (L === 'sol' ? pal.c : pal.x) + '" stroke-width="3.4" stroke-linecap="round"/>'; }
  if (L === 'neon') { const c = T(esp(0, 1 / (K * K))); dec += luzinha(c[0], c[1], 2.6, pal.x, pal.e); }
  return { defs: tinta(id, pal, m, 40, 36), corpo: s + dec + brilhoSol(m, 36, 34, 10, 5.5, -35) };
}

/* ── 3 · ouriço ─────────────────────────────────────────────── */
function ourico(m, id) {
  const pal = PAL[3][m], L = LUZ[m];
  const cfg = [{n:20,L:19,w:3.4,rb:21}, {n:15,L:26,w:3.2,rb:18}, {n:11,L:19,w:7.4,rb:20}, {n:18,L:22,w:2.6,rb:20}, {n:16,L:24,w:2.4,rb:19}][m];
  const cx = 50, cy = 52;
  const acaso = i => ((Math.sin(i * 12.9898 + m * 7.3) * 43758.5453) % 1 + 1) % 1;
  let esp = '', pontas = '';
  for (let i = 0; i < cfg.n; i++) {
    const a = i / cfg.n * 2 * Math.PI + .12, len = cfg.L * (.84 + .16 * acaso(i));
    const x0 = cx + (cfg.rb - 3) * Math.cos(a), y0 = cy + (cfg.rb - 3) * Math.sin(a);
    const x1 = cx + (cfg.rb + len) * Math.cos(a), y1 = cy + (cfg.rb + len) * Math.sin(a);
    const xm = cx + (cfg.rb + len * .42) * Math.cos(a), ym = cy + (cfg.rb + len * .42) * Math.sin(a);
    const dd = 'M' + f1(x0) + ' ' + f1(y0) + 'L' + f1(x1) + ' ' + f1(y1), dp = 'M' + f1(xm) + ' ' + f1(ym) + 'L' + f1(x1) + ' ' + f1(y1);
    if (L === 'sol') {
      esp += '<path d="' + dd + '" stroke="' + pal.e + '" stroke-width="' + cfg.w + '" stroke-linecap="round"/>';
      if (m === 2) esp += '<path d="' + dd + '" stroke="' + pal.x + '" stroke-width="' + f1(cfg.w * .55) + '" stroke-dasharray="2.6 4" stroke-linecap="round" opacity=".7"/>';
      else esp += '<path d="' + dp + '" stroke="' + pal.c + '" stroke-width="' + f1(cfg.w * .5) + '" stroke-linecap="round"/>';
    } else if (L === 'vidro') {
      esp += '<path d="' + dd + '" stroke="' + pal.c + '" stroke-width="' + cfg.w + '" stroke-linecap="round" opacity=".75"/>';

function acasoCena(i, k) { return ((Math.sin(i * 91.7 + k * 13.3) * 43758.5453) % 1 + 1) % 1; }

function particulas(m, acento) {
  let s = '';
  if (m <= 2) {
    const n = [12, 10, 7][m];
    for (let i = 0; i < n; i++) {
      const t = 5 + acasoCena(i, 1) * 8;
      s += '<i class="bolha-amb" style="left:' + (acasoCena(i, 2) * 96).toFixed(1) + '%;width:' + t.toFixed(1) + 'px;height:' + t.toFixed(1) +
           'px;animation-duration:' + (8 + acasoCena(i, 3) * 9).toFixed(1) + 's;animation-delay:-' + (acasoCena(i, 4) * 14).toFixed(1) + 's"></i>';
    }
  } else if (m === 3) {
    for (let i = 0; i < 22; i++) {
      const t = 1.6 + acasoCena(i, 1) * 2.4;
      s += '<i class="neve" style="left:' + (acasoCena(i, 2) * 100).toFixed(1) + '%;width:' + t.toFixed(1) + 'px;height:' + t.toFixed(1) +
           'px;animation-duration:' + (16 + acasoCena(i, 3) * 16).toFixed(1) + 's;animation-delay:-' + (acasoCena(i, 4) * 30).toFixed(1) + 's"></i>';
    }
  } else {
    const cores = [acento, '#9A5CFF', '#5CFF9E', '#5CB4FF', '#FF7390'];
    for (let i = 0; i < 18; i++) {
      const cor = cores[i % cores.length];
      s += '<i class="faisca-bio" style="left:' + (acasoCena(i, 2) * 100).toFixed(1) + '%;top:' + (acasoCena(i, 5) * 88).toFixed(1) +
           '%;background:' + cor + ';box-shadow:0 0 8px 2px ' + cor + ';animation-duration:' + (2.6 + acasoCena(i, 3) * 4).toFixed(1) +
           's;animation-delay:-' + (acasoCena(i, 4) * 6).toFixed(1) + 's"></i>';
    }
  }
  return s;
}

/* bicho passeando no fundo do cenário, desenhado em silhueta */
const NADANTES = {

  arraia: c => '<path d="M50 24c22 0 44 18 44 34 0 8-10 10-20 6-8-4-16-6-24-6s-16 2-24 6c-10 4-20 2-20-6 0-16 22-34 44-34Z" fill="' + c + '"/>' +

    '<path d="M46 26q6-14 16-14-4 10 0 18Z" fill="' + c + '"/>',
  cardume: c => { let s = ''; for (let i = 0; i < 7; i++) { const x = 10 + (i % 4) * 24, y = 26 + Math.floor(i / 4) * 26;
      s += '<g transform="translate(' + x + ' ' + y + ') scale(.7)"><path d="M-12 0C-8 -7 2 -9 9 -4L16 -9L16 9L9 4C2 9 -8 7 -12 0Z" fill="' + c + '"/></g>'; } return s; },
  medusa: c => '<path d="M18 46c0-18 14-30 32-30s32 12 32 30c-6 4-58 4-64 0Z" fill="' + c + '" opacity=".85"/>' +
    '<path d="M28 48q-4 18 2 34M44 48q-2 20 2 36M58 48q2 20-2 36M72 48q4 18-2 32" fill="none" stroke="' + c + '" stroke-width="3.4" stroke-linecap="round" opacity=".7"/>',
  polvo: c => '<path d="M50 14c18 0 28 12 28 26S66 62 50 62 22 54 22 40 32 14 50 14Z" fill="' + c + '"/>' +
    '<path d="M30 56q-8 16-2 28M42 60q-6 18 0 28M58 60q6 18 0 28M70 56q8 16 2 28" fill="none" stroke="' + c + '" stroke-width="5" stroke-linecap="round"/>' +
    '<circle cx="42" cy="34" r="4" fill="rgba(0,0,0,.35)"/><circle cx="58" cy="34" r="4" fill="rgba(0,0,0,.35)"/>',
  tubarao: c => '<path d="M4 54c18-18 46-28 78-26l14-14-4 18 8 10-10 8c-24 10-58 10-86 4Z" fill="' + c + '"/>' +
    '<path d="M44 30q4-18 14-20-4 12 0 22Z" fill="' + c + '"/><path d="M40 62q-4 14-14 18 14-2 22-10Z" fill="' + c + '"/>',
  lanterna: c => '<path d="M24 50c0-16 14-28 32-28s30 12 30 28-14 26-30 26-32-10-32-26Z" fill="' + c + '"/>' +
    '<path d="M56 22C48 8 30 6 22 16" fill="none" stroke="' + c + '" stroke-width="3" stroke-linecap="round"/>' +
    '<circle cx="21" cy="17" r="5" fill="#BFF5EE"/><circle cx="21" cy="17" r="11" fill="#BFF5EE" opacity=".25"/>'
};
const BICHOS_BANDA = [['tartaruga','cardume','arraia'], ['cardume','polvo','arraia'], ['tubarao','arraia','golfinho'],
                      ['medusa','lanterna','arraia'], ['lanterna','medusa','polvo']];
function nadadores(m, amb) {
  const pool = BICHOS_BANDA[m], escuro = m >= 3;
  let s = '';
  for (let i = 0; i < 2; i++) {
    const semente = (amb.banda + 1) * 7 + i * 3 + (amb.reg.nome.length * 5);
    const nome = pool[Math.floor(acasoCena(semente, 11) * pool.length) % pool.length];
    const tam = 46 + acasoCena(i, 7) * 40, topo = 12 + acasoCena(semente, 8) * 54;
    const cor = escuro ? rgba(amb.reg.acento, .5) : rgba('#' + mistura(amb.reg.agua[Math.min(amb.banda + 2, 5)], '#000000', .25), .55);
    s += '<div class="nadador' + (i ? ' volta' : '') + '" style="top:' + topo.toFixed(1) + '%;width:' + tam.toFixed(0) + 'px;height:' + tam.toFixed(0) +
         'px;animation-duration:' + (26 + acasoCena(i, 9) * 24).toFixed(1) + 's;animation-delay:-' + (acasoCena(i, 10) * 22).toFixed(1) +
         's"><svg viewBox="0 0 100 100">' + NADANTES[nome](cor) + '</svg></div>';
  }
  return s;
}

function paletaChao(amb) {
  const r = amb.reg;
  return { fundo: r.agua[Math.min(amb.banda + 1, 5)], acento: r.acento, vida: r.agua[1],
           pedra: r.moldura, areia: r.moldura, gelo: hex(r.agua[0], .3), madeira: r.moldura };
}

function cena(m, amb) {
  let s = '';
  if (m <= 1) s += '<div class="causticas"></div>';
  if (m <= 2) s += '<div class="raios"><i></i><i></i><i></i><i></i><i></i></div>';
  s += '<svg class="chao" viewBox="0 0 400 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true">' +
       (PROPS[amb.chao] || PROPS.pedra)(paletaChao(amb)) + '</svg>';
  s += nadadores(m, amb);
  s += '<div class="particulas">' + particulas(m, amb.reg.acento) + '</div>';
  return s;
}

function coresBanda(reg, k) {
  const t = reg.agua[k], f = reg.agua[Math.min(k + 1, 5)];
  return [t, '#' + mistura(t, f, .45), '#' + mistura(t, f, .82), f];
}

/* ═══ TROCA DE AMBIENTE ═════════════════════════════════════════
   A profundidade manda na luz e nas peças; a região pinta a água,
   o chão, a moldura da mesa e o que cobre o fundo.                */
let mundoAtual = -1, ambAtual = null, conjAtual = '', acentoAtual = '';

function instalaMundo(m, i) {
  const amb = ambiente(i == null ? 0 : i);
  const trato = amb.reg.trato || 'limpo';
  const igual = (m === mundoAtual && ambAtual && ambAtual.reg === amb.reg && ambAtual.chao === amb.chao && trato === conjAtual);
  ambAtual = amb;
  const raiz = document.documentElement.style, c = coresBanda(amb.reg, amb.banda);
  c.forEach((cor, k) => raiz.setProperty('--ag' + (k + 1), cor));
  raiz.setProperty('--moldura', amb.reg.moldura);
  raiz.setProperty('--acento', amb.reg.acento);
  /* a mesa precisa ser sempre escura o bastante para a peça saltar,
     mesmo quando a água da região é clara */
  const escuro = luminancia(c[3]) > .45 ? .72 : .5;
  raiz.setProperty('--mesa-a', rgba('#' + mistura(c[3], '#000000', escuro), .68));
  raiz.setProperty('--mesa-b', rgba('#' + mistura(c[3], '#000000', escuro + .16), .78));
  const fa = (typeof J !== 'undefined' && J && J.fase >= 0) ? fase(J.fase) : null;
  const bl = fa && fa.obj.corrente ? BLOQUEIOS.corrente : fa && fa.obj.mancha ? BLOQUEIOS.mancha : amb.bloq;
  raiz.setProperty('--bl-a', bl.a); raiz.setProperty('--bl-b', bl.b);
  raiz.setProperty('--bl-a2', bl.a2); raiz.setProperty('--bl-b2', bl.b2);
  document.body.dataset.tex = bl.tex;
  document.body.dataset.mundo = m;
  const cx = document.getElementById('cena');
  cx.style.filter = amb.tom || '';
  if (igual) return;
  mundoAtual = m;
  conjAtual = trato; acentoAtual = amb.reg.acento;
  document.getElementById('defs-pecas').innerHTML = simbolos(m, '', trato, amb.reg.acento);
  cx.innerHTML = cena(m, amb);
  Som.m = m;
}
function corDaBarra(cor) { const t = document.querySelector('meta[name="theme-color"]'); if (t) t.setAttribute('content', cor); }
const COR_TOPO = ['#9BE9E0', '#3FC0C6', '#1A6E98', '#123067', '#0A0F28'];


let efeitosPendentes = [];
/* ponto extra por disparar especial e por juntar dois deles:
   é o que faz valer a pena montar a jogada em vez de só combinar 3 */
let bonusEspeciais = 0;
const VALOR_ESP = { 1: 300, 2: 300, 3: 900, 4: 900, 5: 1400, 6: 1400, 7: 1100 };     /* correnteza, correnteza em pé, bolha, pérola */
const VALOR_NASCE = { 1: 150, 2: 150, 3: 250, 4: 400, 5: 600, 6: 600, 7: 500 };   /* por criar cada um deles */

/* ═══ ESTADO ════════════════════════════════════════════════════ */
let grid = [], papel = [], uid = 0;
let J = {
  fase: 0, mov: 0, pontos: 0, coletado: [0,0,0,0,0,0],
  papelTotal: 0, papelFeito: 0, ocupado: true, fim: false, cascata: 1
};

/* ═══ MONTAGEM ══════════════════════════════════════════════════ */
function tipoSeguro(r, c) {
  const proibido = new Set();
  if (c >= 2 && grid[r][c-1] && grid[r][c-2] && grid[r][c-1].t === grid[r][c-2].t) proibido.add(grid[r][c-1].t);
  if (r >= 2 && grid[r-1][c] && grid[r-2][c] && grid[r-1][c].t === grid[r-2][c].t) proibido.add(grid[r-1][c].t);
  let t, giro = 0;
  do { t = sorteia(TIPOS); giro++; } while (proibido.has(t) && giro < 40);
  return t;
}
function novaPeca(t) { return { id: ++uid, t: t, sp: NADA }; }
/* o baú não combina com nada, não sai com especial e só quer chegar no fundo */
function novoBau() { return { id: ++uid, t: -1, sp: NADA, bau: true }; }

/* TOPO diz em que fileira cada coluna começa. Coluna mais curta
   significa menos casas, e é isso que dá formato ao tabuleiro:
   arco, pirâmide, degraus, taça. Fora do formato não existe casa. */
let TOPO = Array(W).fill(0);
const temCasa = (r, c) => r >= TOPO[c] && r < H && c >= 0 && c < W;

function montaTabuleiro() {
  do {
    grid = Array.from({ length: H }, () => Array(W).fill(null));
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++)
      if (temCasa(r, c)) grid[r][c] = novaPeca(tipoSeguro(r, c));
  } while (acharCorridas().length || !temJogada());
}

/* ═══ COMBOS ════════════════════════════════════════════════════ */
function acharCorridas() {
  const out = [];
  for (let r = 0; r < H; r++) {
    let c = 0;
    while (c < W) {
      const p = grid[r][c];
      if (!p || p.bau || p.gaiola) { c++; continue; }
      let k = c + 1;
      while (k < W && grid[r][k] && !grid[r][k].bau && !grid[r][k].gaiola && grid[r][k].t === p.t) k++;
      if (k - c >= 3) out.push({ dir: 'h', r: r, c: c, len: k - c, t: p.t });
      c = k;
    }
  }
  for (let c = 0; c < W; c++) {
    let r = 0;
    while (r < H) {
      const p = grid[r][c];
      if (!p || p.bau || p.gaiola) { r++; continue; }
      let k = r + 1;
      while (k < H && grid[k][c] && !grid[k][c].bau && !grid[k][c].gaiola && grid[k][c].t === p.t) k++;
      if (k - r >= 3) out.push({ dir: 'v', r: r, c: c, len: k - r, t: p.t });
      r = k;
    }
  }
  return out;
}

function fazGrupos(corridas) {
  const marc = new Map();
  for (const co of corridas) {
    for (let i = 0; i < co.len; i++) {
      marc.set(co.dir === 'h' ? chave(co.r, co.c + i) : chave(co.r + i, co.c), co.t);
    }
  }
  const vistos = new Set(), gs = [];
  for (const k0 of marc.keys()) {
    if (vistos.has(k0)) continue;
    const t = marc.get(k0), pilha = [k0], cells = [];
    vistos.add(k0);
    while (pilha.length) {
      const x = pilha.pop(); cells.push(x);
      const r = linha(x), c = coluna(x);
      const viz = [[r+1,c],[r-1,c],[r,c+1],[r,c-1]];
      for (const [nr, nc] of viz) {
        if (!dentro(nr, nc)) continue;
        const nk = chave(nr, nc);
        if (!vistos.has(nk) && marc.get(nk) === t) { vistos.add(nk); pilha.push(nk); }
      }
    }
    const set = new Set(cells);
    let maxH = 1, maxV = 1;
    for (const x of cells) {
      const r = linha(x), c = coluna(x);
      let n = 1;
      for (let cc = c - 1; dentro(r, cc) && set.has(chave(r, cc)); cc--) n++;
      for (let cc = c + 1; dentro(r, cc) && set.has(chave(r, cc)); cc++) n++;
      if (n > maxH) maxH = n;
      let m = 1;
      for (let rr = r - 1; dentro(rr, c) && set.has(chave(rr, c)); rr--) m++;
      for (let rr = r + 1; dentro(rr, c) && set.has(chave(rr, c)); rr++) m++;
      if (m > maxV) maxV = m;
    }
    gs.push({ t: t, cells: cells, set: set, maxH: maxH, maxV: maxV });
  }
  return gs;
}

function especialDoGrupo(g) {
  if (g.maxH >= 6) return ONDA;          /* seis deitadas: maré, leva três fileiras */
  if (g.maxV >= 6) return ONDAV;         /* seis em pé: maré de través */
  if (g.cells.length >= 7) return CARDUME;  /* aglomerado grande: cardume */
  if (g.maxH >= 5 || g.maxV >= 5) return ARCO;
  if (g.maxH >= 3 && g.maxV >= 3) return BOMBA;
  if (g.maxH >= 4) return LH;
  if (g.maxV >= 4) return LV;
  return NADA;
}
function posEspecial(g, preferidos) {
  for (const k of preferidos) if (k != null && g.set.has(k)) return k;
  for (const x of g.cells) {
    const r = linha(x), c = coluna(x);
    let n = 1;
    for (let cc = c - 1; dentro(r, cc) && g.set.has(chave(r, cc)); cc--) n++;
    for (let cc = c + 1; dentro(r, cc) && g.set.has(chave(r, cc)); cc++) n++;
    let m = 1;
    for (let rr = r - 1; dentro(rr, c) && g.set.has(chave(rr, c)); rr--) m++;
    for (let rr = r + 1; dentro(rr, c) && g.set.has(chave(rr, c)); rr++) m++;
    if (n >= 3 && m >= 3) return x;
  }
  return g.cells[(g.cells.length / 2) | 0];
}

/* ═══ ESPECIAIS ═════════════════════════════════════════════════ */
function corMaisComum() {
  const n = Array(TIPOS).fill(0);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (grid[r][c] && !grid[r][c].bau) n[grid[r][c].t]++;
  let melhor = 0;
  for (let i = 1; i < TIPOS; i++) if (n[i] > n[melhor]) melhor = i;
  return melhor;
}
function areaEspecial(r, c, p, corAlvo) {
  const out = [];
  if (p.sp === LH) { for (let x = 0; x < W; x++) if (temCasa(r, x)) out.push(chave(r, x)); }
  else if (p.sp === LV) { for (let y = 0; y < H; y++) if (temCasa(y, c)) out.push(chave(y, c)); }
  else if (p.sp === BOMBA) {
    /* bomba é bomba: leva tudo em volta, 5x5 cheio */
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++)
      if (temCasa(r + dr, c + dc)) out.push(chave(r + dr, c + dc));
  } else if (p.sp === ONDA) {
    for (let dr = -1; dr <= 1; dr++) for (let x = 0; x < W; x++) if (temCasa(r + dr, x)) out.push(chave(r + dr, x));
  } else if (p.sp === ONDAV) {
    for (let dc = -1; dc <= 1; dc++) for (let y = 0; y < H; y++) if (temCasa(y, c + dc)) out.push(chave(y, c + dc));
  } else if (p.sp === CARDUME) {
    /* o cardume sai caçando a própria cor pelo tabuleiro */
    const iguais = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      if (grid[y][x] && !grid[y][x].bau && grid[y][x].t === p.t && !(y === r && x === c)) iguais.push(chave(y, x));
    for (let k = iguais.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); const t = iguais[k]; iguais[k] = iguais[j]; iguais[j] = t; }
    out.push(chave(r, c));
    for (const k of iguais.slice(0, 9)) out.push(k);
  } else if (p.sp === ARCO) {
    const t = (corAlvo != null) ? corAlvo : corMaisComum();
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x] && grid[y][x].t === t) out.push(chave(y, x));
  }
  return out;
}
/* propaga: todo especial dentro do conjunto dispara também */
function expandir(conj, corAlvo) {
  const fila = [...conj], feitos = new Set();
  let guarda = 0;
  while (fila.length && guarda++ < 4000) {
    const k = fila.pop();
    if (feitos.has(k)) continue;
    feitos.add(k);
    const r = linha(k), c = coluna(k), p = grid[r][c];
    if (!p || !p.sp) continue;
    const area = areaEspecial(r, c, p, corAlvo);
    const vale = VALOR_ESP[p.sp] || 0;
    bonusEspeciais += vale * (typeof J !== 'undefined' && J.soltoSozinho && J.cascata === 1 ? .5 : 1);
    efeitosPendentes.push({ r: r, c: c, sp: p.sp, vale: vale, alvos: (p.sp === ARCO || p.sp === CARDUME) ? area.slice() : null });
    for (const a of area) {
      if (!conj.has(a)) conj.add(a);
      if (!feitos.has(a)) fila.push(a);
    }
  }
  return conj;
}

/* troca de dois especiais (ou confete com qualquer doce) */
function comboTroca(ra, ca, rb, cb) {
  const a = grid[ra][ca], b = grid[rb][cb];
  const conj = new Set();
  const ka = chave(ra, ca), kb = chave(rb, cb);
  const sa = a.sp, sb = b.sp;
  let corAlvo = null;

  /* a camada de efeitos precisa saber o que estourou, porque aqui
     os especiais são desarmados antes do expandir passar          */
  const tudo = () => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (temCasa(y, x)) conj.add(chave(y, x)); efeitosPendentes.push({ r: rb, c: cb, sp: 'tudo', vale: 4000 }); bonusEspeciais += 4000; };
  const linhaToda = r => { for (let x = 0; x < W; x++) if (temCasa(r, x)) conj.add(chave(r, x)); efeitosPendentes.push({ r: r, c: cb, sp: LH, vale: 400 }); bonusEspeciais += 400; };
  const colunaToda = c => { for (let y = 0; y < H; y++) if (temCasa(y, c)) conj.add(chave(y, c)); efeitosPendentes.push({ r: rb, c: c, sp: LV, vale: 400 }); bonusEspeciais += 400; };

  if (sa === ARCO && sb === ARCO) {
    a.sp = b.sp = NADA; tudo();
  } else if (sa === ARCO || sb === ARCO) {
    const arco = sa === ARCO ? a : b;
    const outro = sa === ARCO ? b : a;
    const kArco = sa === ARCO ? ka : kb, kOutro = sa === ARCO ? kb : ka;
    arco.sp = NADA;
    conj.add(kArco); conj.add(kOutro);
    if (outro.sp === LH || outro.sp === LV || outro.sp === BOMBA) {
      bonusEspeciais += 3500;
      const alvo = outro.sp;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const p = grid[y][x];
        if (p && p.t === outro.t) { p.sp = alvo === BOMBA ? BOMBA : (Math.random() < 0.5 ? LH : LV); conj.add(chave(y, x)); }
      }
    } else {
      corAlvo = outro.t;
      const alvos = [];
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x] && grid[y][x].t === outro.t) { conj.add(chave(y, x)); alvos.push(chave(y, x)); }
      efeitosPendentes.push({ r: rb, c: cb, sp: ARCO, vale: 1600, alvos: alvos });
      bonusEspeciais += 1600;
    }
  } else if ((sa === LH || sa === LV) && (sb === LH || sb === LV)) {
    a.sp = b.sp = NADA;
    for (let d = -1; d <= 1; d++) { if (dentro(rb + d, 0)) linhaToda(rb + d); if (dentro(0, cb + d)) colunaToda(cb + d); }
    conj.add(ka);
  } else if ((sa === BOMBA && (sb === LH || sb === LV)) || (sb === BOMBA && (sa === LH || sa === LV))) {
    a.sp = b.sp = NADA;
    for (let d = -2; d <= 2; d++) { if (dentro(rb + d, 0)) linhaToda(rb + d); if (dentro(0, cb + d)) colunaToda(cb + d); }
    conj.add(ka);
  } else if (sa === ONDA || sa === ONDAV || sa === CARDUME || sb === ONDA || sb === ONDAV || sb === CARDUME) {
    /* maré ou cardume no combo: os dois especiais estouram juntos */
    for (const k of areaEspecial(rb, cb, b, null)) conj.add(k);
    for (const k of areaEspecial(ra, ca, a, null)) conj.add(k);
    efeitosPendentes.push({ r: rb, c: cb, sp: sb, vale: 1800 });
    efeitosPendentes.push({ r: ra, c: ca, sp: sa, vale: 0 });
    bonusEspeciais += 1800;
    a.sp = b.sp = NADA;
    conj.add(ka); conj.add(kb);
  } else if (sa === BOMBA && sb === BOMBA) {
    a.sp = b.sp = NADA;
    efeitosPendentes.push({ r: rb, c: cb, sp: BOMBA, tam: 9, vale: 3500 });
    bonusEspeciais += 3500;
    for (let dr = -3; dr <= 3; dr++) for (let dc = -3; dc <= 3; dc++)
      if (temCasa(rb + dr, cb + dc)) conj.add(chave(rb + dr, cb + dc));
    conj.add(ka);
  } else {
    conj.add(ka); conj.add(kb);
  }
  expandir(conj, corAlvo);
  return conj;
}

/* ═══ JOGADA POSSÍVEL ═══════════════════════════════════════════ */
function criaCombo(r1, c1, r2, c2) {
  const a = grid[r1][c1], b = grid[r2][c2];
  if (!a || !b) return false;
  grid[r1][c1] = b; grid[r2][c2] = a;
  const ok = temCorridaEm(r1, c1) || temCorridaEm(r2, c2);
  grid[r1][c1] = a; grid[r2][c2] = b;
  return ok;
}
function temCorridaEm(r, c) {
  const p = grid[r][c]; if (!p || p.bau) return false;
  let n = 1;
  for (let x = c - 1; x >= 0 && grid[r][x] && !grid[r][x].bau && grid[r][x].t === p.t; x--) n++;
  for (let x = c + 1; x < W && grid[r][x] && !grid[r][x].bau && grid[r][x].t === p.t; x++) n++;
  if (n >= 3) return true;
  let m = 1;
  for (let y = r - 1; y >= 0 && grid[y][c] && grid[y][c].t === p.t; y--) m++;
  for (let y = r + 1; y < H && grid[y][c] && grid[y][c].t === p.t; y++) m++;
  return m >= 3;
}
function achaJogada() {
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const p = grid[r][c]; if (!p) continue;
    if (p.sp === ARCO) return [r, c, (c < W - 1 ? r : r), (c < W - 1 ? c + 1 : c - 1)];
    if (c < W - 1) {
      const q = grid[r][c+1];
      if (q && (q.sp === ARCO || (p.sp && q.sp) || criaCombo(r, c, r, c + 1))) return [r, c, r, c + 1];
    }
    if (r < H - 1) {
      const q = grid[r+1][c];
      if (q && (q.sp === ARCO || (p.sp && q.sp) || criaCombo(r, c, r + 1, c))) return [r, c, r + 1, c];
    }
  }
  return null;
}
function temJogada() { return !!achaJogada(); }

function embaralhaModelo() {
  let voltas = 0;
  do {
    const soltos = [];
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (grid[r][c] && !grid[r][c].sp && !grid[r][c].bau) soltos.push(grid[r][c].t);
    for (let i = soltos.length - 1; i > 0; i--) { const j = sorteia(i + 1); const t = soltos[i]; soltos[i] = soltos[j]; soltos[j] = t; }
    let i = 0;
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (grid[r][c] && !grid[r][c].sp && !grid[r][c].bau) grid[r][c].t = soltos[i++];
    voltas++;
  } while ((acharCorridas().length || !temJogada()) && voltas < 60);
}

/* ═══ GRAVIDADE ═════════════════════════════════════════════════ */
function gravidade() {
  const caindo = [];
  for (let c = 0; c < W; c++) {
    let escreve = H - 1;
    for (let r = H - 1; r >= TOPO[c]; r--) {
      if (grid[r][c]) {
        if (r !== escreve) {
          grid[escreve][c] = grid[r][c]; grid[r][c] = null; caindo.push(grid[escreve][c]);
          if (grid[escreve][c].bau) J.bauParado = 0;   /* desceu por mérito seu: a rede de segurança zera */
        }
        escreve--;
      }
    }
    let acima = -1;
    for (let r = escreve; r >= TOPO[c]; r--) {
      /* enquanto faltar baú, ele entra junto com as peças novas, de pouco em pouco */
      /* um baú por coluna: empilhados eles se atrapalham */
      let colunaLivre = true;
      for (let q = 0; q < H; q++) if (grid[q][c] && grid[q][c].bau) colunaLivre = false;
      const cabeBau = J.bauPendentes > 0 && J.bauNaTela < 2 && colunaLivre && r === escreve && rnd() < .42;
      const p = cabeBau ? novoBau() : novaPeca(sorteia(TIPOS));
      if (cabeBau) { J.bauPendentes--; J.bauNaTela++; }
      p.entrando = acima--;
      grid[r][c] = p; caindo.push(p);
    }
  }
  return caindo;
}


/* ═══ DESENHO ═══════════════════════════════════════════════════ */
let CEL = 44; const GAP = 4;
const els = new Map();
let mesa, celulasBox, pecasBox, faiscasBox;

function dimensiona() {
  const area = document.querySelector('.area-jogo');
  if (!area || !area.clientHeight) return;
  const dispW = area.clientWidth - 16 - GAP * 2;
  const dispH = area.clientHeight - 12 - GAP * 2;
  const teto = Math.min(window.innerWidth, window.innerHeight) >= 700 ? 72 : 64;   /* tablet merece peça maior */
  CEL = Math.max(32, Math.min(Math.floor(Math.min(dispW / W, dispH / H)), teto));
  document.documentElement.style.setProperty('--cel', CEL + 'px');
  mesa.style.width = (CEL * W + GAP * 2) + 'px';
  mesa.style.height = (CEL * H + GAP * 2) + 'px';
  celulasBox.style.width = pecasBox.style.width = (CEL * W) + 'px';
  celulasBox.style.height = pecasBox.style.height = (CEL * H) + 'px';
  posicionaCasas();
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const p = grid[r][c]; if (!p) continue;
    const el = els.get(p.id); if (el) posiciona(el, r, c, true);
  }
}

function posicionaCasas() {
  const casas = celulasBox.children;
  for (let i = 0; i < casas.length; i++) {
    const r = (i / W) | 0, c = i % W;
    casas[i].style.transform = 'translate(' + (c * CEL) + 'px,' + (r * CEL) + 'px)';
  }
}
function montaCasas() {
  celulasBox.innerHTML = '';
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const d = document.createElement('div');
    d.className = 'casa' + (r === H - 1 ? ' fundo' : '') + (r < TOPO[c] ? ' fora' : '');
    d.innerHTML = '<i></i>';
    celulasBox.appendChild(d);
  }
  pintaPapel();
  posicionaCasas();
}
function pintaPapel() {
  const casas = celulasBox.children;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const d = casas[r * W + c];
    d.classList.remove('papel', 'papel2');
    if (papel[r][c] >= 3) d.classList.add('papel3');
    else if (papel[r][c] === 2) d.classList.add('papel2');
    else if (papel[r][c] === 1) d.classList.add('papel');
  }
}
function quebraPapel(r, c) {
  const d = celulasBox.children[r * W + c];
  d.classList.add('rasga');
  setTimeout(() => {
    d.classList.remove('rasga', 'papel', 'papel2', 'papel3');
    if (papel[r][c] >= 3) d.classList.add('papel3');
    else if (papel[r][c] === 2) d.classList.add('papel2');
    else if (papel[r][c] === 1) d.classList.add('papel');
  }, 340);
}

function corpoDaPeca(p) {
  let s = '';
  if (p.bau) return '<svg viewBox="0 0 100 100"><use href="#i-bau"/></svg>';
  if (p.sp === ARCO) s = '<svg viewBox="0 0 100 100"><use href="#s-arco"/></svg>';
  else {
    s = '<svg viewBox="0 0 100 100"><use href="#s' + p.t + ['', 'b', 'c'][p.id % 3] + '"/></svg>';
    if (p.sp === LH) s += '<div class="capa"><svg viewBox="0 0 100 100"><use href="#sp-lh"/></svg></div>';
    else if (p.sp === LV) s += '<div class="capa"><svg viewBox="0 0 100 100"><use href="#sp-lv"/></svg></div>';
    else if (p.sp === BOMBA) s += '<div class="capa"><svg viewBox="0 0 100 100"><use href="#sp-bomba"/></svg></div>';
    else if (p.sp === ONDA) s += '<div class="capa"><svg viewBox="0 0 100 100"><use href="#sp-onda"/></svg></div>';
    else if (p.sp === ONDAV) s += '<div class="capa"><svg viewBox="0 0 100 100"><use href="#sp-ondav"/></svg></div>';
    else if (p.sp === CARDUME) s += '<div class="capa"><svg viewBox="0 0 100 100"><use href="#sp-cardume"/></svg></div>';
  }
  return s;
}
function classeEsp(p) {
  if (p.bau) return 'e-bau';
  if (p.gaiola) return 'preso' + (p.gaiola >= 2 ? ' preso2' : '');
  if (p.bolha) return 'com-bolha';
  return p.sp === LH ? 'esp-lh' : p.sp === LV ? 'esp-lv' : p.sp === BOMBA ? 'esp-bomba' : p.sp === ARCO ? 'esp-arco'
       : p.sp === ONDA || p.sp === ONDAV ? 'esp-onda' : p.sp === CARDUME ? 'esp-cardume' : '';
}
function criaEl(p) {
  /* cada peça respira num tempo diferente: o tabuleiro fica vivo sem piscar junto */
  const el = document.createElement('div');
  el.className = 'peca ' + classeEsp(p);
  el.dataset.id = p.id;
  el.style.setProperty('--atraso', (((p.id * 37) % 34) / 10).toFixed(1) + 's');
  el.innerHTML = '<div class="corpo">' + corpoDaPeca(p) + '</div>';
  return el;
}
function atualizaEl(p) {
  if (!p) return;                        /* casa fora do formato */
  const el = els.get(p.id); if (!el) return;
  el.className = 'peca ' + classeEsp(p);
  el.querySelector('.corpo').innerHTML = corpoDaPeca(p);
}
function posiciona(el, r, c, semAnim) {
  if (semAnim) {
    const t = el.style.transition; el.style.transition = 'none';
    el.style.transform = 'translate(' + (c * CEL) + 'px,' + (r * CEL) + 'px)';
    el.offsetHeight;
    el.style.transition = t;
  } else {
    el.style.transform = 'translate(' + (c * CEL) + 'px,' + (r * CEL) + 'px)';
  }
}
function sincroniza(classe) {
  const novos = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const p = grid[r][c]; if (!p) continue;
    if (!els.get(p.id)) {
      const el = criaEl(p);
      pecasBox.appendChild(el); els.set(p.id, el);
      posiciona(el, (p.entrando != null ? p.entrando : r), c, true);
      p.entrando = null;
      novos.push(el);
    }
  }
  if (novos.length) pecasBox.offsetHeight;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const p = grid[r][c]; if (!p) continue;
    const el = els.get(p.id);
    if (classe) { el.classList.add(classe); setTimeout(() => el.classList.remove(classe), 340); }
    posiciona(el, r, c);
  }
}
function montaPecas() {
  pecasBox.innerHTML = ''; els.clear();
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const p = grid[r][c];
    if (!p) continue;                      /* casa fora do formato */
    const el = criaEl(p); pecasBox.appendChild(el); els.set(p.id, el);
    posiciona(el, r, c, true);
    if (typeof el.firstChild.animate === 'function')
      el.firstChild.animate([{ transform: 'scale(0) rotate(-40deg)', opacity: 0 }, { transform: 'scale(1) rotate(0)', opacity: 1 }],
        { duration: 340, delay: (r + c) * 22, easing: 'cubic-bezier(.2,1.6,.4,1)', fill: 'backwards' });
  }
}


/* ═══ EFEITOS ═══════════════════════════════════════════════════
   Tudo aqui é curto e some sozinho. A regra: quanto maior a
   jogada, mais camadas entram (luz, onda, estilhaço, tremor).   */
/* Safari velho não tem element.animate: nesses o efeito só não aparece */
function anima(el, quadros, opcoes) {
  if (typeof el.animate !== 'function') { el.style.opacity = '0'; return null; }
  try { return el.animate(quadros, opcoes); } catch (e) { el.style.opacity = '0'; return null; }
}
function solta(el, ms, onde) {
  const caixa = onde || faiscasBox;
  if (caixa === faiscasBox && caixa.childElementCount > 150) return;   /* teto pra não engasgar celular fraco */
  caixa.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

function raioLinha(r, c, deitado) {
  const d = document.createElement('div');
  d.className = 'fx-raio' + (deitado ? '' : ' v');
  if (deitado) { d.style.left = '0px'; d.style.top = (r * CEL) + 'px'; d.style.width = (W * CEL) + 'px'; d.style.height = CEL + 'px'; }
  else { d.style.top = '0px'; d.style.left = (c * CEL) + 'px'; d.style.height = (H * CEL) + 'px'; d.style.width = CEL + 'px'; }
  solta(d, 980);
}
function ondaChoque(r, c, tam, cor) {
  const d = document.createElement('div'), s = tam * CEL;
  d.className = 'fx-onda';
  d.style.width = d.style.height = s + 'px';
  d.style.left = (c * CEL + CEL / 2 - s / 2) + 'px';
  d.style.top = (r * CEL + CEL / 2 - s / 2) + 'px';
  if (cor) d.style.borderColor = cor;
  solta(d, 1020);
}
function feixePerola(r, c, alvos) {
  for (const k of alvos.slice(0, 14)) {
    const ar = linha(k), ac = coluna(k);
    const x1 = c * CEL + CEL / 2, y1 = r * CEL + CEL / 2;
    const dx = ac * CEL + CEL / 2 - x1, dy = ar * CEL + CEL / 2 - y1;
    const d = document.createElement('div');
    d.className = 'fx-feixe';
    d.style.left = x1 + 'px'; d.style.top = (y1 - 2) + 'px';
    d.style.width = Math.hypot(dx, dy) + 'px';
    d.style.transform = 'rotate(' + (Math.atan2(dy, dx) * 180 / Math.PI) + 'deg)';
    solta(d, 860);
  }
}
function estilhacos(r, c, cor, n) {
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'estilhaco';
    const t = 4 + Math.random() * 7;
    d.style.width = t + 'px'; d.style.height = (t * (.5 + Math.random())) + 'px';
    d.style.background = cor;
    d.style.left = (c * CEL + CEL / 2) + 'px';
    d.style.top = (r * CEL + CEL / 2) + 'px';
    const ang = Math.random() * Math.PI * 2, dist = 22 + Math.random() * 60;
    anima(d, [
      { transform: 'translate(-50%,-50%) rotate(0deg) scale(1)', opacity: 1 },
      { transform: 'translate(' + (Math.cos(ang) * dist - 50) + '%,' + (Math.sin(ang) * dist + 40) + '%) rotate(' + (Math.random() * 720 - 360) + 'deg) scale(.3)', opacity: 0 }
    ], { duration: 520 + Math.random() * 420, easing: 'cubic-bezier(.15,.7,.4,1)' });
    solta(d, 950);
  }
}
function clarao(cor) {
  const f = document.getElementById('clarao');
  if (!f) return;
  f.style.background = 'radial-gradient(circle at 50% 52%, ' + cor + ', transparent 68%)';
  f.classList.remove('bate'); void f.offsetWidth; f.classList.add('bate');
}
function tremeTela(nivel) {
  mesa.classList.remove('treme', 'treme2', 'treme3');
  void mesa.offsetWidth;
  mesa.classList.add(nivel >= 3 ? 'treme3' : nivel === 2 ? 'treme2' : 'treme');
  setTimeout(() => mesa.classList.remove('treme', 'treme2', 'treme3'), 440);
}
function chipCombo(n) {
  const el = document.getElementById('combo');
  if (!el) return;
  el.textContent = 'x' + n;
  el.className = 'combo n' + Math.min(n, 6);
  void el.offsetWidth;
  el.classList.add('mostra');
  clearTimeout(chipCombo.t);
  chipCombo.t = setTimeout(() => el.classList.remove('mostra'), 950);
}
/* fogos para a vitória: acontecem por cima de tudo */
function fogos(n) {
  const tela = document.getElementById('fx-tela');
  if (!tela) return;
  const cores = ['#6BFFE0', '#FFD35C', '#FF7390', '#9A5CFF', '#5CFF9E', '#5CB4FF'];
  for (let i = 0; i < n; i++) setTimeout(() => {
    const x = 12 + Math.random() * 76, y = 18 + Math.random() * 50, cor = cores[i % cores.length];
    for (let j = 0; j < 14; j++) {
      const d = document.createElement('div');
      d.className = 'fagulha';
      d.style.width = d.style.height = (4 + Math.random() * 5) + 'px';
      d.style.left = x + '%'; d.style.top = y + '%';
      d.style.background = cor; d.style.boxShadow = '0 0 10px 3px ' + cor;
      const a = (j / 14) * Math.PI * 2, dist = 50 + Math.random() * 90;
      anima(d, [{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
                 { transform: 'translate(' + (Math.cos(a) * dist) + 'px,' + (Math.sin(a) * dist + 30) + 'px) scale(.2)', opacity: 0 }],
                { duration: 800 + Math.random() * 300, easing: 'cubic-bezier(.1,.8,.3,1)' });
      solta(d, 1200, tela);
    }
    Som.liga(); Som.sobe(i % 4);
  }, i * 260);
}

/* faíscas e pontinhos */
function faisca(r, c, texto, cor, grande) {
  const d = document.createElement('div');
  d.className = 'ponto-voa' + (grande ? ' grande' : '');
  d.textContent = texto;
  if (cor) d.style.color = cor;
  d.style.left = (c * CEL + CEL / 2) + 'px';
  d.style.top = (r * CEL) + 'px';
  faiscasBox.appendChild(d);
  setTimeout(() => d.remove(), 1000);
}
/* respingo de quando a peça estoura: bolha subindo onde tem sol,
   fagulha de luz própria onde não tem */
function corDe(t) { const m = mundoAtual < 0 ? 0 : mundoAtual; return LUZ[m] === 'sol' ? PAL[t][m].b : PAL[t][m].c; }
function respingos(r, c, cor, n) {
  const brilho = mundoAtual >= 3;
  for (let i = 0; i < (n || 6); i++) {
    const d = document.createElement('div');
    const tam = brilho ? 3 + Math.random() * 4 : 5 + Math.random() * 7;
    d.className = brilho ? 'fagulha' : 'bolhinha';

    d.style.left = (c * CEL + CEL / 2 - tam / 2) + 'px';
    d.style.top = (r * CEL + CEL / 2 - tam / 2) + 'px';
    const ang = Math.random() * Math.PI * 2, dist = 16 + Math.random() * 36;
    const dx = Math.cos(ang) * dist, dy = brilho ? Math.sin(ang) * dist : Math.sin(ang) * dist * .45 - 26 - Math.random() * 30;
    anima(d, [
      { transform: 'translate(0,0) scale(.5)', opacity: 1 },
      { transform: 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(1)', opacity: 0 }
    ], { duration: 650 + Math.random() * 350, easing: 'cubic-bezier(.2,.8,.4,1)' });
    solta(d, 1050);
  }
}
const ELOGIOS = ['Boa!', 'Isso!', 'Que onda!', 'Mandou bem!', 'Maré cheia!', 'Redemoinho!'];
let faixaTimer = null;
function faixaTexto(t, ms) {
  const f = document.getElementById('faixa');

  f.classList.remove('mostra'); f.offsetHeight; f.classList.add('mostra');
