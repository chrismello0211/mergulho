let efeitosPendentes = [];

/* ═══ ESTADO ════════════════════════════════════════════════════ */
let grid = [], papel = [], uid = 0;
let J = {
  fase: 0, mov: 0, pontos: 0, coletado: [0,0,0,0,0,0],
  papelTotal: 0, papelFeito: 0, ocupado: true, fim: false, cascata: 1
};

/* ═══ MONTAGEM ══════════════════════════════════════════════════ */
function tipoSeguro(r, c) {
  const proibido = new Set();
  if (c >= 2 && grid[r][c-1] && grid[r][c-2] && grid[r][c-1].t === grid[r][c-2].t) proibido.add(grid[r][c-1].t);
  if (r >= 2 && grid[r-1][c] && grid[r-2][c] && grid[r-1][c].t === grid[r-2][c].t) proibido.add(grid[r-1][c].t);
  let t, giro = 0;
  do { t = sorteia(TIPOS); giro++; } while (proibido.has(t) && giro < 40);
  return t;
}
function novaPeca(t) { return { id: ++uid, t: t, sp: NADA }; }
/* o baú não combina com nada, não sai com especial e só quer chegar no fundo */
function novoBau() { return { id: ++uid, t: -1, sp: NADA, bau: true }; }

function montaTabuleiro() {
  do {
    grid = Array.from({ length: H }, () => Array(W).fill(null));
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) grid[r][c] = novaPeca(tipoSeguro(r, c));
  } while (acharCorridas().length || !temJogada());
}

/* ═══ COMBOS ════════════════════════════════════════════════════ */
function acharCorridas() {
  const out = [];
  for (let r = 0; r < H; r++) {
    let c = 0;
    while (c < W) {
      const p = grid[r][c];
      if (!p || p.bau) { c++; continue; }
      let k = c + 1;
      while (k < W && grid[r][k] && !grid[r][k].bau && grid[r][k].t === p.t) k++;
      if (k - c >= 3) out.push({ dir: 'h', r: r, c: c, len: k - c, t: p.t });
      c = k;
    }
  }
  for (let c = 0; c < W; c++) {
    let r = 0;
    while (r < H) {
      const p = grid[r][c];
      if (!p || p.bau) { r++; continue; }
      let k = r + 1;
      while (k < H && grid[k][c] && !grid[k][c].bau && grid[k][c].t === p.t) k++;
      if (k - r >= 3) out.push({ dir: 'v', r: r, c: c, len: k - r, t: p.t });
      r = k;
    }
  }
  return out;
}

function fazGrupos(corridas) {
  const marc = new Map();
  for (const co of corridas) {
    for (let i = 0; i < co.len; i++) {
      marc.set(co.dir === 'h' ? chave(co.r, co.c + i) : chave(co.r + i, co.c), co.t);
    }
  }
  const vistos = new Set(), gs = [];
  for (const k0 of marc.keys()) {
    if (vistos.has(k0)) continue;
    const t = marc.get(k0), pilha = [k0], cells = [];
    vistos.add(k0);
    while (pilha.length) {
      const x = pilha.pop(); cells.push(x);
      const r = linha(x), c = coluna(x);
      const viz = [[r+1,c],[r-1,c],[r,c+1],[r,c-1]];
      for (const [nr, nc] of viz) {
        if (!dentro(nr, nc)) continue;
        const nk = chave(nr, nc);
        if (!vistos.has(nk) && marc.get(nk) === t) { vistos.add(nk); pilha.push(nk); }
      }
    }
    const set = new Set(cells);
    let maxH = 1, maxV = 1;
    for (const x of cells) {
      const r = linha(x), c = coluna(x);
      let n = 1;
      for (let cc = c - 1; dentro(r, cc) && set.has(chave(r, cc)); cc--) n++;
      for (let cc = c + 1; dentro(r, cc) && set.has(chave(r, cc)); cc++) n++;
      if (n > maxH) maxH = n;
      let m = 1;
      for (let rr = r - 1; dentro(rr, c) && set.has(chave(rr, c)); rr--) m++;
      for (let rr = r + 1; dentro(rr, c) && set.has(chave(rr, c)); rr++) m++;
      if (m > maxV) maxV = m;
    }
    gs.push({ t: t, cells: cells, set: set, maxH: maxH, maxV: maxV });
  }
  return gs;
}

function especialDoGrupo(g) {
  if (g.maxH >= 5 || g.maxV >= 5) return ARCO;
  if (g.maxH >= 3 && g.maxV >= 3) return BOMBA;
  if (g.maxH >= 4) return LH;
  if (g.maxV >= 4) return LV;
  return NADA;
}
function posEspecial(g, preferidos) {
  for (const k of preferidos) if (k != null && g.set.has(k)) return k;
  for (const x of g.cells) {
    const r = linha(x), c = coluna(x);
    let n = 1;
    for (let cc = c - 1; dentro(r, cc) && g.set.has(chave(r, cc)); cc--) n++;
    for (let cc = c + 1; dentro(r, cc) && g.set.has(chave(r, cc)); cc++) n++;
    let m = 1;
    for (let rr = r - 1; dentro(rr, c) && g.set.has(chave(rr, c)); rr--) m++;
    for (let rr = r + 1; dentro(rr, c) && g.set.has(chave(rr, c)); rr++) m++;
    if (n >= 3 && m >= 3) return x;
  }
  return g.cells[(g.cells.length / 2) | 0];
}

/* ═══ ESPECIAIS ═════════════════════════════════════════════════ */
function corMaisComum() {
  const n = Array(TIPOS).fill(0);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (grid[r][c] && !grid[r][c].bau) n[grid[r][c].t]++;
  let melhor = 0;
  for (let i = 1; i < TIPOS; i++) if (n[i] > n[melhor]) melhor = i;
  return melhor;
}
function areaEspecial(r, c, p, corAlvo) {
  const out = [];
  if (p.sp === LH) { for (let x = 0; x < W; x++) out.push(chave(r, x)); }
  else if (p.sp === LV) { for (let y = 0; y < H; y++) out.push(chave(y, c)); }
  else if (p.sp === BOMBA) {
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++)
      if (Math.abs(dr) + Math.abs(dc) <= 2 && dentro(r + dr, c + dc)) out.push(chave(r + dr, c + dc));
  } else if (p.sp === ARCO) {
    const t = (corAlvo != null) ? corAlvo : corMaisComum();
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x] && grid[y][x].t === t) out.push(chave(y, x));
  }
  return out;
}
/* propaga: todo especial dentro do conjunto dispara também */
function expandir(conj, corAlvo) {
  const fila = [...conj], feitos = new Set();
  let guarda = 0;
  while (fila.length && guarda++ < 4000) {
    const k = fila.pop();
    if (feitos.has(k)) continue;
    feitos.add(k);
    const r = linha(k), c = coluna(k), p = grid[r][c];
    if (!p || !p.sp) continue;
    const area = areaEspecial(r, c, p, corAlvo);
    efeitosPendentes.push({ r: r, c: c, sp: p.sp, alvos: p.sp === ARCO ? area.slice() : null });
    for (const a of area) {
      if (!conj.has(a)) conj.add(a);
      if (!feitos.has(a)) fila.push(a);
    }
  }
  return conj;
}

/* troca de dois especiais (ou confete com qualquer doce) */
function comboTroca(ra, ca, rb, cb) {
  const a = grid[ra][ca], b = grid[rb][cb];
  const conj = new Set();
  const ka = chave(ra, ca), kb = chave(rb, cb);
  const sa = a.sp, sb = b.sp;
  let corAlvo = null;

  /* a camada de efeitos precisa saber o que estourou, porque aqui
     os especiais são desarmados antes do expandir passar          */
  const tudo = () => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) conj.add(chave(y, x)); efeitosPendentes.push({ r: rb, c: cb, sp: 'tudo' }); };
  const linhaToda = r => { for (let x = 0; x < W; x++) conj.add(chave(r, x)); efeitosPendentes.push({ r: r, c: cb, sp: LH }); };
  const colunaToda = c => { for (let y = 0; y < H; y++) conj.add(chave(y, c)); efeitosPendentes.push({ r: rb, c: c, sp: LV }); };

  if (sa === ARCO && sb === ARCO) {
    a.sp = b.sp = NADA; tudo();
  } else if (sa === ARCO || sb === ARCO) {
    const arco = sa === ARCO ? a : b;
    const outro = sa === ARCO ? b : a;
    const kArco = sa === ARCO ? ka : kb, kOutro = sa === ARCO ? kb : ka;
    arco.sp = NADA;
    conj.add(kArco); conj.add(kOutro);
    if (outro.sp === LH || outro.sp === LV || outro.sp === BOMBA) {
      const alvo = outro.sp;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const p = grid[y][x];
        if (p && p.t === outro.t) { p.sp = alvo === BOMBA ? BOMBA : (Math.random() < 0.5 ? LH : LV); conj.add(chave(y, x)); }
      }
    } else {
      corAlvo = outro.t;
      const alvos = [];
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x] && grid[y][x].t === outro.t) { conj.add(chave(y, x)); alvos.push(chave(y, x)); }
      efeitosPendentes.push({ r: rb, c: cb, sp: ARCO, alvos: alvos });
    }
  } else if ((sa === LH || sa === LV) && (sb === LH || sb === LV)) {
    a.sp = b.sp = NADA;
    linhaToda(rb); colunaToda(cb); conj.add(ka);
  } else if ((sa === BOMBA && (sb === LH || sb === LV)) || (sb === BOMBA && (sa === LH || sa === LV))) {
    a.sp = b.sp = NADA;
    for (let d = -1; d <= 1; d++) { if (dentro(rb + d, 0)) linhaToda(rb + d); if (dentro(0, cb + d)) colunaToda(cb + d); }
    conj.add(ka);
  } else if (sa === BOMBA && sb === BOMBA) {
    a.sp = b.sp = NADA;
    efeitosPendentes.push({ r: rb, c: cb, sp: BOMBA, tam: 8 });
    for (let dr = -3; dr <= 3; dr++) for (let dc = -3; dc <= 3; dc++)
      if (Math.abs(dr) + Math.abs(dc) <= 3 && dentro(rb + dr, cb + dc)) conj.add(chave(rb + dr, cb + dc));
    conj.add(ka);
  } else {
    conj.add(ka); conj.add(kb);
  }
  expandir(conj, corAlvo);
  return conj;
}

/* ═══ JOGADA POSSÍVEL ═══════════════════════════════════════════ */
function criaCombo(r1, c1, r2, c2) {
  const a = grid[r1][c1], b = grid[r2][c2];
  if (!a || !b) return false;
  grid[r1][c1] = b; grid[r2][c2] = a;
  const ok = temCorridaEm(r1, c1) || temCorridaEm(r2, c2);
  grid[r1][c1] = a; grid[r2][c2] = b;
  return ok;
}
function temCorridaEm(r, c) {
  const p = grid[r][c]; if (!p || p.bau) return false;
  let n = 1;
  for (let x = c - 1; x >= 0 && grid[r][x] && !grid[r][x].bau && grid[r][x].t === p.t; x--) n++;
  for (let x = c + 1; x < W && grid[r][x] && !grid[r][x].bau && grid[r][x].t === p.t; x++) n++;
  if (n >= 3) return true;
  let m = 1;
  for (let y = r - 1; y >= 0 && grid[y][c] && grid[y][c].t === p.t; y--) m++;
  for (let y = r + 1; y < H && grid[y][c] && grid[y][c].t === p.t; y++) m++;
  return m >= 3;
}
function achaJogada() {
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const p = grid[r][c]; if (!p) continue;
    if (p.sp === ARCO) return [r, c, (c < W - 1 ? r : r), (c < W - 1 ? c + 1 : c - 1)];
    if (c < W - 1) {
      const q = grid[r][c+1];
      if (q && (q.sp === ARCO || (p.sp && q.sp) || criaCombo(r, c, r, c + 1))) return [r, c, r, c + 1];
    }
    if (r < H - 1) {
      const q = grid[r+1][c];
      if (q && (q.sp === ARCO || (p.sp && q.sp) || criaCombo(r, c, r + 1, c))) return [r, c, r + 1, c];
    }
  }
  return null;
}
function temJogada() { return !!achaJogada(); }

function embaralhaModelo() {
  let voltas = 0;
  do {
    const soltos = [];
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (grid[r][c] && !grid[r][c].sp && !grid[r][c].bau) soltos.push(grid[r][c].t);
    for (let i = soltos.length - 1; i > 0; i--) { const j = sorteia(i + 1); const t = soltos[i]; soltos[i] = soltos[j]; soltos[j] = t; }
    let i = 0;
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (grid[r][c] && !grid[r][c].sp && !grid[r][c].bau) grid[r][c].t = soltos[i++];
    voltas++;
  } while ((acharCorridas().length || !temJogada()) && voltas < 60);
}

/* ═══ GRAVIDADE ═════════════════════════════════════════════════ */
function gravidade() {
  const caindo = [];
  for (let c = 0; c < W; c++) {
    let escreve = H - 1;
    for (let r = H - 1; r >= 0; r--) {
      if (grid[r][c]) {
        if (r !== escreve) { grid[escreve][c] = grid[r][c]; grid[r][c] = null; caindo.push(grid[escreve][c]); }
        escreve--;
      }
    }
    let acima = -1;
    for (let r = escreve; r >= 0; r--) {
      /* enquanto faltar baú, ele entra junto com as peças novas, de pouco em pouco */
      /* um baú por coluna: empilhados eles se atrapalham */
      let colunaLivre = true;
      for (let q = 0; q < H; q++) if (grid[q][c] && grid[q][c].bau) colunaLivre = false;
      const cabeBau = J.bauPendentes > 0 && J.bauNaTela < 2 && colunaLivre && r === escreve && rnd() < .42;
      const p = cabeBau ? novoBau() : novaPeca(sorteia(TIPOS));
      if (cabeBau) { J.bauPendentes--; J.bauNaTela++; }
      p.entrando = acima--;
      grid[r][c] = p; caindo.push(p);
    }
  }
  return caindo;
}


/* ═══ DESENHO ═══════════════════════════════════════════════════ */
let CEL = 44; const GAP = 4;
const els = new Map();
let mesa, celulasBox, pecasBox, faiscasBox;

function dimensiona() {
  const area = document.querySelector('.area-jogo');
  if (!area || !area.clientHeight) return;
  const dispW = area.clientWidth - 16 - GAP * 2;
  const dispH = area.clientHeight - 12 - GAP * 2;
  const teto = Math.min(window.innerWidth, window.innerHeight) >= 700 ? 72 : 64;   /* tablet merece peça maior */
  CEL = Math.max(32, Math.min(Math.floor(Math.min(dispW / W, dispH / H)), teto));
  document.documentElement.style.setProperty('--cel', CEL + 'px');
  mesa.style.width = (CEL * W + GAP * 2) + 'px';
  mesa.style.height = (CEL * H + GAP * 2) + 'px';
  celulasBox.style.width = pecasBox.style.width = (CEL * W) + 'px';
  celulasBox.style.height = pecasBox.style.height = (CEL * H) + 'px';
  posicionaCasas();
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const p = grid[r][c]; if (!p) continue;
    const el = els.get(p.id); if (el) posiciona(el, r, c, true);
  }
}

function posicionaCasas() {
  const casas = celulasBox.children;
  for (let i = 0; i < casas.length; i++) {
    const r = (i / W) | 0, c = i % W;
    casas[i].style.transform = 'translate(' + (c * CEL) + 'px,' + (r * CEL) + 'px)';
  }
}
function montaCasas() {
  celulasBox.innerHTML = '';
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const d = document.createElement('div');
    d.className = 'casa' + (r === H - 1 ? ' fundo' : '');
    d.innerHTML = '<i></i>';
    celulasBox.appendChild(d);
  }
  pintaPapel();
  posicionaCasas();
}
function pintaPapel() {
  const casas = celulasBox.children;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const d = casas[r * W + c];
    d.classList.remove('papel', 'papel2');
    if (papel[r][c] >= 2) d.classList.add('papel2');
    else if (papel[r][c] === 1) d.classList.add('papel');
  }
}
function quebraPapel(r, c) {
  const d = celulasBox.children[r * W + c];
  d.classList.add('rasga');
  setTimeout(() => {
    d.classList.remove('rasga', 'papel', 'papel2');
    if (papel[r][c] >= 2) d.classList.add('papel2');
    else if (papel[r][c] === 1) d.classList.add('papel');
  }, 340);
}

function corpoDaPeca(p) {
  let s = '';
  if (p.bau) return '<svg viewBox="0 0 100 100"><use href="#i-bau"/></svg>';
  if (p.sp === ARCO) s = '<svg viewBox="0 0 100 100"><use href="#s-arco"/></svg>';
  else {
    s = '<svg viewBox="0 0 100 100"><use href="#s' + p.t + '"/></svg>';
    if (p.sp === LH) s += '<div class="capa"><svg viewBox="0 0 100 100"><use href="#sp-lh"/></svg></div>';
    else if (p.sp === LV) s += '<div class="capa"><svg viewBox="0 0 100 100"><use href="#sp-lv"/></svg></div>';
    else if (p.sp === BOMBA) s += '<div class="capa"><svg viewBox="0 0 100 100"><use href="#sp-bomba"/></svg></div>';
  }
  return s;
}
function classeEsp(p) {
  if (p.bau) return 'e-bau';
  return p.sp === LH ? 'esp-lh' : p.sp === LV ? 'esp-lv' : p.sp === BOMBA ? 'esp-bomba' : p.sp === ARCO ? 'esp-arco' : '';
}
function criaEl(p) {
  const el = document.createElement('div');
  el.className = 'peca ' + classeEsp(p);
  el.dataset.id = p.id;
  el.innerHTML = '<div class="corpo">' + corpoDaPeca(p) + '</div>';
  return el;
}
function atualizaEl(p) {
  const el = els.get(p.id); if (!el) return;
  el.className = 'peca ' + classeEsp(p);
  el.querySelector('.corpo').innerHTML = corpoDaPeca(p);
}
function posiciona(el, r, c, semAnim) {
  if (semAnim) {
    const t = el.style.transition; el.style.transition = 'none';
    el.style.transform = 'translate(' + (c * CEL) + 'px,' + (r * CEL) + 'px)';
    el.offsetHeight;
    el.style.transition = t;
  } else {
    el.style.transform = 'translate(' + (c * CEL) + 'px,' + (r * CEL) + 'px)';
  }
}
function sincroniza(classe) {
  const novos = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const p = grid[r][c]; if (!p) continue;
    if (!els.get(p.id)) {
      const el = criaEl(p);
      pecasBox.appendChild(el); els.set(p.id, el);
      posiciona(el, (p.entrando != null ? p.entrando : r), c, true);
      p.entrando = null;
      novos.push(el);
    }
  }
  if (novos.length) pecasBox.offsetHeight;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const p = grid[r][c]; if (!p) continue;
    const el = els.get(p.id);
    if (classe) { el.classList.add(classe); setTimeout(() => el.classList.remove(classe), 340); }
    posiciona(el, r, c);
  }
}
function montaPecas() {
  pecasBox.innerHTML = ''; els.clear();
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const p = grid[r][c];
    const el = criaEl(p); pecasBox.appendChild(el); els.set(p.id, el);
    posiciona(el, r, c, true);
    if (typeof el.firstChild.animate === 'function')
      el.firstChild.animate([{ transform: 'scale(0) rotate(-40deg)', opacity: 0 }, { transform: 'scale(1) rotate(0)', opacity: 1 }],
        { duration: 340, delay: (r + c) * 22, easing: 'cubic-bezier(.2,1.6,.4,1)', fill: 'backwards' });
  }
}


/* ═══ EFEITOS ═══════════════════════════════════════════════════
   Tudo aqui é curto e some sozinho. A regra: quanto maior a
   jogada, mais camadas entram (luz, onda, estilhaço, tremor).   */
/* Safari velho não tem element.animate: nesses o efeito só não aparece */
function anima(el, quadros, opcoes) {
  if (typeof el.animate !== 'function') { el.style.opacity = '0'; return null; }
  try { return el.animate(quadros, opcoes); } catch (e) { el.style.opacity = '0'; return null; }
}
function solta(el, ms, onde) {
  const caixa = onde || faiscasBox;
  if (caixa === faiscasBox && caixa.childElementCount > 150) return;   /* teto pra não engasgar celular fraco */
  caixa.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

function raioLinha(r, c, deitado) {
  const d = document.createElement('div');
  d.className = 'fx-raio' + (deitado ? '' : ' v');
  if (deitado) { d.style.left = '0px'; d.style.top = (r * CEL) + 'px'; d.style.width = (W * CEL) + 'px'; d.style.height = CEL + 'px'; }
  else { d.style.top = '0px'; d.style.left = (c * CEL) + 'px'; d.style.height = (H * CEL) + 'px'; d.style.width = CEL + 'px'; }
  solta(d, 640);
}
function ondaChoque(r, c, tam, cor) {
  const d = document.createElement('div'), s = tam * CEL;
  d.className = 'fx-onda';
  d.style.width = d.style.height = s + 'px';
  d.style.left = (c * CEL + CEL / 2 - s / 2) + 'px';
  d.style.top = (r * CEL + CEL / 2 - s / 2) + 'px';
  if (cor) d.style.borderColor = cor;
  solta(d, 660);
}
function feixePerola(r, c, alvos) {
  for (const k of alvos.slice(0, 14)) {
    const ar = linha(k), ac = coluna(k);
    const x1 = c * CEL + CEL / 2, y1 = r * CEL + CEL / 2;
    const dx = ac * CEL + CEL / 2 - x1, dy = ar * CEL + CEL / 2 - y1;
    const d = document.createElement('div');
    d.className = 'fx-feixe';
    d.style.left = x1 + 'px'; d.style.top = (y1 - 2) + 'px';
    d.style.width = Math.hypot(dx, dy) + 'px';
    d.style.transform = 'rotate(' + (Math.atan2(dy, dx) * 180 / Math.PI) + 'deg)';
    solta(d, 540);
  }
}
function estilhacos(r, c, cor, n) {
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'estilhaco';
    const t = 4 + Math.random() * 7;
    d.style.width = t + 'px'; d.style.height = (t * (.5 + Math.random())) + 'px';
    d.style.background = cor;
    d.style.left = (c * CEL + CEL / 2) + 'px';
    d.style.top = (r * CEL + CEL / 2) + 'px';
    const ang = Math.random() * Math.PI * 2, dist = 22 + Math.random() * 60;
    anima(d, [
      { transform: 'translate(-50%,-50%) rotate(0deg) scale(1)', opacity: 1 },
      { transform: 'translate(' + (Math.cos(ang) * dist - 50) + '%,' + (Math.sin(ang) * dist + 40) + '%) rotate(' + (Math.random() * 720 - 360) + 'deg) scale(.3)', opacity: 0 }
    ], { duration: 520 + Math.random() * 420, easing: 'cubic-bezier(.15,.7,.4,1)' });
    solta(d, 950);
  }
}
function clarao(cor) {
  const f = document.getElementById('clarao');
  if (!f) return;
  f.style.background = 'radial-gradient(circle at 50% 52%, ' + cor + ', transparent 68%)';
  f.classList.remove('bate'); void f.offsetWidth; f.classList.add('bate');
}
function tremeTela(nivel) {
  mesa.classList.remove('treme', 'treme2', 'treme3');
  void mesa.offsetWidth;
  mesa.classList.add(nivel >= 3 ? 'treme3' : nivel === 2 ? 'treme2' : 'treme');
  setTimeout(() => mesa.classList.remove('treme', 'treme2', 'treme3'), 440);
}
function chipCombo(n) {
  const el = document.getElementById('combo');
  if (!el) return;
  el.textContent = 'x' + n;
  el.className = 'combo n' + Math.min(n, 6);
  void el.offsetWidth;
  el.classList.add('mostra');
  clearTimeout(chipCombo.t);
  chipCombo.t = setTimeout(() => el.classList.remove('mostra'), 950);
}
/* fogos para a vitória: acontecem por cima de tudo */
function fogos(n) {
  const tela = document.getElementById('fx-tela');
  if (!tela) return;
  const cores = ['#6BFFE0', '#FFD35C', '#FF7390', '#9A5CFF', '#5CFF9E', '#5CB4FF'];
  for (let i = 0; i < n; i++) setTimeout(() => {
    const x = 12 + Math.random() * 76, y = 18 + Math.random() * 50, cor = cores[i % cores.length];
    for (let j = 0; j < 14; j++) {
      const d = document.createElement('div');
      d.className = 'fagulha';
      d.style.width = d.style.height = (4 + Math.random() * 5) + 'px';
      d.style.left = x + '%'; d.style.top = y + '%';
      d.style.background = cor; d.style.boxShadow = '0 0 10px 3px ' + cor;
      const a = (j / 14) * Math.PI * 2, dist = 50 + Math.random() * 90;
      anima(d, [{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
                 { transform: 'translate(' + (Math.cos(a) * dist) + 'px,' + (Math.sin(a) * dist + 30) + 'px) scale(.2)', opacity: 0 }],
                { duration: 800 + Math.random() * 300, easing: 'cubic-bezier(.1,.8,.3,1)' });
      solta(d, 1200, tela);
    }
    Som.liga(); Som.sobe(i % 4);
  }, i * 260);
}

/* faíscas e pontinhos */
function faisca(r, c, texto, cor, grande) {
  const d = document.createElement('div');
  d.className = 'ponto-voa' + (grande ? ' grande' : '');
  d.textContent = texto;
  if (cor) d.style.color = cor;
  d.style.left = (c * CEL + CEL / 2) + 'px';
  d.style.top = (r * CEL) + 'px';
  faiscasBox.appendChild(d);
  setTimeout(() => d.remove(), 1000);
}
/* respingo de quando a peça estoura: bolha subindo onde tem sol,
   fagulha de luz própria onde não tem */
function corDe(t) { const m = mundoAtual < 0 ? 0 : mundoAtual; return LUZ[m] === 'sol' ? PAL[t][m].b : PAL[t][m].c; }
function respingos(r, c, cor, n) {
  const brilho = mundoAtual >= 3;
  for (let i = 0; i < (n || 6); i++) {
    const d = document.createElement('div');
    const tam = brilho ? 3 + Math.random() * 4 : 5 + Math.random() * 7;
    d.className = brilho ? 'fagulha' : 'bolhinha';
    d.style.width = d.style.height = tam.toFixed(1) + 'px';
    if (brilho) { d.style.background = cor; d.style.boxShadow = '0 0 8px 2px ' + cor; }
    d.style.left = (c * CEL + CEL / 2 - tam / 2) + 'px';
    d.style.top = (r * CEL + CEL / 2 - tam / 2) + 'px';
    const ang = Math.random() * Math.PI * 2, dist = 16 + Math.random() * 36;
    const dx = Math.cos(ang) * dist, dy = brilho ? Math.sin(ang) * dist : Math.sin(ang) * dist * .45 - 26 - Math.random() * 30;
    anima(d, [
      { transform: 'translate(0,0) scale(.5)', opacity: 1 },
      { transform: 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(1)', opacity: 0 }
    ], { duration: 650 + Math.random() * 350, easing: 'cubic-bezier(.2,.8,.4,1)' });
    solta(d, 1050);
  }
}
const ELOGIOS = ['Boa!', 'Isso!', 'Que onda!', 'Mandou bem!', 'Maré cheia!', 'Redemoinho!'];
function faixaTexto(t) {
  const f = document.getElementById('faixa');
  f.textContent = t; f.classList.remove('mostra'); f.offsetHeight; f.classList.add('mostra');
}

/* ═══ O BAÚ CHEGANDO AO FUNDO ═══════════════════════════════════
   Quem encosta na última fileira já saiu: desce escorregando,
   solta faísca dourada e vale 500.                               */
async function entregaBaus() {
  const saem = [];
  for (let c = 0; c < W; c++) { const p = grid[H - 1][c]; if (p && p.bau) saem.push([c, p]); }
  if (!saem.length) return false;
  for (const [c, p] of saem) {
    const el = els.get(p.id);
    if (el) { el.classList.add('entrega'); const e = el; setTimeout(() => e.remove(), 560); }
    els.delete(p.id);
    grid[H - 1][c] = null;
    J.bauFeito++; J.bauNaTela = Math.max(0, J.bauNaTela - 1);
    J.pontos += 500;
    faisca(H - 1, c, '+500', '#FFD35C', true);
    respingos(H - 1, c, '#FFD35C', 10);
    estilhacos(H - 1, c, '#FFD35C', 8);
    ondaChoque(H - 1, c, 3.4, '#FFD35C');
  }
  Som.liga(); Som.bau(); vibra(TREMIDA.bau); clarao('rgba(255,211,92,.35)'); tremeTela(2);
  atualizaHud();
  await espera(460);
  gravidade();
  sincroniza('cai');
  await espera(280);
  return true;
}

/* ═══ LIMPEZA E CASCATA ═════════════════════════════════════════ */
async function limpar(conj, novos) {
  const vivas = [...conj].filter(k => { const p = grid[linha(k)][coluna(k)]; return p && !p.bau; });
  if (!vivas.length && !(novos && novos.length)) return false;

  let ganho = 0, temEsp = false;
  let sr = 0, sc = 0;
  for (const k of vivas) {
    const r = linha(k), c = coluna(k), p = grid[r][c];
    if (p.sp) temEsp = true;
    J.coletado[p.t]++;
    ganho += 60 * Math.min(J.cascata, 8);
    sr += r; sc += c;
    const el = els.get(p.id);
    if (el) el.classList.add('some');
    if (papel[r][c] > 0) { papel[r][c]--; J.papelFeito++; quebraPapel(r, c); }
    if (vivas.length <= 14 || Math.random() < 0.5) {
      respingos(r, c, corDe(p.t), vivas.length > 10 ? 4 : 7);
      estilhacos(r, c, corDe(p.t), vivas.length > 12 ? 2 : 4);
    }
  }
  if (vivas.length >= 6) ganho += (vivas.length - 5) * 90;
  J.pontos += ganho;

  Som.liga();
  /* cada especial que disparou desenha o próprio estrago */
  let peso = vivas.length >= 8 ? 2 : 1;
  for (const e of efeitosPendentes) {
    if (e.sp === LH) { raioLinha(e.r, e.c, true); Som.raio(); peso = Math.max(peso, 2); }
    else if (e.sp === LV) { raioLinha(e.r, e.c, false); Som.raio(); peso = Math.max(peso, 2); }
    else if (e.sp === BOMBA) { ondaChoque(e.r, e.c, e.tam || 5.4, '#FFE7A3'); Som.bomba(); clarao('rgba(255,231,163,.45)'); peso = 3; }
    else if (e.sp === 'tudo') {
      Som.combo(); clarao('rgba(255,255,255,.6)');
      [0, 120, 240].forEach((d, i) => setTimeout(() => ondaChoque(3 + i, 3, 7 + i * 2, ['#fff', '#6BFFE0', '#FFD35C'][i]), d));
      faixaTexto('Tudo!');
      peso = 3;
    }
    else if (e.sp === ARCO && e.alvos) { feixePerola(e.r, e.c, e.alvos); ondaChoque(e.r, e.c, 4, '#CFE9FF'); Som.combo(); clarao('rgba(207,233,255,.5)'); peso = 3; }
  }
  efeitosPendentes.length = 0;

  if (temEsp || vivas.length >= 8) {
    Som.estoura(); tremeTela(peso); vibra(peso >= 3 ? TREMIDA.combo : TREMIDA.especial);
    if (peso >= 2) clarao('rgba(107,255,224,.28)');
  } else {
    Som.pop(J.cascata); vibra(vivas.length >= 5 ? TREMIDA.grande : TREMIDA.combina);
    if (vivas.length >= 5) tremeTela(1);
  }
  if (J.cascata >= 2) { chipCombo(J.cascata); Musica.tensao(J.mov <= 5, J.cascata); }
  if (J.cascata >= 4) { clarao('rgba(255,211,92,.3)'); tremeTela(3); }

  if (vivas.length) {
    const mr = Math.round(sr / vivas.length), mc = Math.round(sc / vivas.length);
    faisca(mr, mc, '+' + ganho, J.cascata > 2 ? '#6BFFE0' : null, ganho >= 600 || J.cascata >= 3);
    if (ganho >= 900) ondaChoque(mr, mc, 3.2, '#FFD35C');
  }
  if (J.cascata === 3) faixaTexto(ELOGIOS[sorteia(3) + 1]);
  if (J.cascata >= 5) faixaTexto(ELOGIOS[4 + (J.cascata >= 7 ? 1 : 0)]);

  atualizaHud();
  await espera(210);

  for (const k of vivas) {
    const r = linha(k), c = coluna(k), p = grid[r][c];
    if (!p) continue;
    const el = els.get(p.id);
    if (el) { el.remove(); els.delete(p.id); }
    grid[r][c] = null;
  }
  if (novos) for (const n of novos) {
    const r = linha(n.k), c = coluna(n.k), p = grid[r][c];
    if (!p) continue;
    p.sp = n.sp;
    atualizaEl(p);
    const el = els.get(p.id);
    if (el) { el.classList.add('nasce'); setTimeout(() => el.classList.remove('nasce'), 320); }
    Som.especial();
  }
  await espera(70);
  gravidade();
  sincroniza('cai');
  Som.cai(Math.min(J.cascata, 6));
  await espera(270);
  return true;
}

async function resolver(conjInicial, preferidos) {
  J.cascata = 1;
  let conj = conjInicial || null;
  let voltas = 0;
  while (voltas++ < 60) {
    let grupos = [];
    if (!conj) {
      const corridas = acharCorridas();
      if (!corridas.length) { if (await entregaBaus()) continue; break; }
      grupos = fazGrupos(corridas);
      conj = new Set();
      for (const g of grupos) for (const k of g.cells) conj.add(k);
      expandir(conj, null);
    }
    const novos = [];
    for (const g of grupos) {
      const sp = especialDoGrupo(g);
      if (sp) {
        const k = posEspecial(g, preferidos || []);
        novos.push({ k: k, sp: sp });
      }
    }
    for (const n of novos) conj.delete(n.k);
    await limpar(conj, novos);
    conj = null; preferidos = null;
    J.cascata++;
    atualizaHud();
  }
  J.cascata = 1;

  if (!temJogada()) {
    faixaTexto('Sem jogada, embaralhando');
    await espera(700);
    embaralhaModelo();
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) atualizaEl(grid[r][c]);
    sincroniza('nasce');
    await espera(400);
  }
}

/* ═══ TOQUE ═════════════════════════════════════════════════════ */
let sel = null, arrasto = null, tempoParado = null;

function celulaDe(x, y) {
  const b = celulasBox.getBoundingClientRect();
  const c = Math.floor((x - b.left) / CEL), r = Math.floor((y - b.top) / CEL);
  return dentro(r, c) ? { r: r, c: c } : null;
}
function marca(cel) {
  limpaMarca();
  sel = cel;
  if (!cel) return;
  const p = grid[cel.r][cel.c];
  if (p && els.get(p.id)) els.get(p.id).classList.add('escolhida');
}
function limpaMarca() {
  if (sel) {
    const p = grid[sel.r][sel.c];
    if (p && els.get(p.id)) els.get(p.id).classList.remove('escolhida');
  }
  sel = null;
}
function vizinhas(a, b) { return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1; }

function aoPressionar(e) {
  if (J.ocupado || J.fim) return;
  Som.liga();
  const cel = celulaDe(e.clientX, e.clientY);
  if (!cel) return;
  if (poderAtivo) { usaPoderNaCelula(cel); return; }
  arrasto = { x: e.clientX, y: e.clientY, cel: cel, usado: false };
  mesa.setPointerCapture && mesa.setPointerCapture(e.pointerId);
}
function aoMover(e) {
  if (!arrasto || arrasto.usado || J.ocupado) return;
  const dx = e.clientX - arrasto.x, dy = e.clientY - arrasto.y;
  const lim = CEL * 0.42;
  if (Math.abs(dx) < lim && Math.abs(dy) < lim) return;
  let alvo;
  if (Math.abs(dx) > Math.abs(dy)) alvo = { r: arrasto.cel.r, c: arrasto.cel.c + (dx > 0 ? 1 : -1) };
  else alvo = { r: arrasto.cel.r + (dy > 0 ? 1 : -1), c: arrasto.cel.c };
  arrasto.usado = true;
  if (dentro(alvo.r, alvo.c)) tentaTroca(arrasto.cel, alvo);
  arrasto = null;
}
function aoSoltar(e) {
  if (!arrasto || arrasto.usado) { arrasto = null; return; }
  const cel = arrasto.cel; arrasto = null;
  if (J.ocupado || J.fim) return;
  if (sel && sel.r === cel.r && sel.c === cel.c) {
    const p = grid[cel.r][cel.c];
    limpaMarca();
    if (p && p.sp) disparaEspecial(cel);   /* dois toques no especial: ele estoura sozinho */
    return;
  }
  if (sel && vizinhas(sel, cel)) { const a = sel; limpaMarca(); tentaTroca(a, cel); return; }
  marca(cel);
}

async function tentaTroca(a, b) {
  if (J.ocupado || J.fim) return;
  limpaMarca();
  const pa = grid[a.r][a.c], pb = grid[b.r][b.c];
  if (!pa || !pb) return;
  J.ocupado = true;
  reiniciaDica();

  const ea = els.get(pa.id), eb = els.get(pb.id);
  grid[a.r][a.c] = pb; grid[b.r][b.c] = pa;
  posiciona(ea, b.r, b.c); posiciona(eb, a.r, a.c);
  Som.liga(); Som.troca();
  await espera(190);

  const especial = (pa.sp === ARCO || pb.sp === ARCO) || (pa.sp && pb.sp);
  const virouCombo = temCorridaEm(a.r, a.c) || temCorridaEm(b.r, b.c);
  const temBau = pa.bau || pb.bau;   /* empurrar o baú de lado é jogada válida */
  /* especial não precisa de combinação: trocar ele com qualquer vizinha já dispara */
  const soltaEsp = !especial && !virouCombo && !temBau && !!(pa.sp || pb.sp);

  if (!especial && !virouCombo && !temBau && !soltaEsp) {
    grid[a.r][a.c] = pa; grid[b.r][b.c] = pb;
    posiciona(ea, a.r, a.c); posiciona(eb, b.r, b.c);
    ea.classList.add('nao'); eb.classList.add('nao');
    Som.nao();
    setTimeout(() => { ea.classList.remove('nao'); eb.classList.remove('nao'); }, 360);
    await espera(320);
    J.ocupado = false;
    reiniciaDica();
    return;
  }

  gastaJogada();
  let conj = null;
  if (soltaEsp) {
    const alvo = pa.sp ? b : a;                 /* a peça especial está no lugar novo */
    conj = new Set([chave(alvo.r, alvo.c)]);
    expandir(conj, null);
    vibra(TREMIDA.especial);
  } else if (especial) {
    conj = comboTroca(b.r, b.c, a.r, a.c);
    atualizaEl(grid[a.r][a.c]); atualizaEl(grid[b.r][b.c]);
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (grid[r][c]) atualizaEl(grid[r][c]);
    faixaTexto('Combinação!');
    vibra(40);
  }
  await resolver(conj, [chave(b.r, b.c), chave(a.r, a.c)]);
  passoCrescer();
  salvaPartida();
  J.ocupado = false;
  await confere();
  reiniciaDica();
}

async function disparaEspecial(cel) {
  const p = grid[cel.r][cel.c];
  if (!p || !p.sp || J.ocupado || J.fim) return;
  J.ocupado = true;
  reiniciaDica();
  gastaJogada();
  Som.liga(); Som.especial(); vibra(TREMIDA.especial);
  const conj = new Set([chave(cel.r, cel.c)]);
  expandir(conj, null);
  await resolver(conj, [chave(cel.r, cel.c)]);
  passoCrescer();
  salvaPartida();
  J.ocupado = false;
  await confere();
  reiniciaDica();
}

/* guarda a partida a cada jogada: se o celular matar o app, volta igual */
function salvaPartida() {
  if (!J || J.fim || J.desafio || J.fase == null || J.fase < 0) return;
  try {
    localStorage.setItem(CHAVE_PARTIDA, JSON.stringify({
      f: J.fase, mov: J.mov, pontos: J.pontos, col: J.coletado,
      pt: J.papelTotal, pf: J.papelFeito, bf: J.bauFeito, bn: J.bauNaTela, bp: J.bauPendentes,
      cc: J.contaCresce, ac: J.alvoCresce, papel: papel, base: J.papelBase,
      g: grid.map(l => l.map(p => p ? (p.bau ? 'b' : p.t + '.' + p.sp) : ''))
    }));
  } catch (e) { /* sem espaço: só não guarda */ }
}

/* ═══ ALGA QUE VOLTA A CRESCER ══════════════════════════════════
   A casa marcada cresce na jogada seguinte, nunca sem aviso, e
   nunca nas três últimas jogadas: dá pra reagir.                 */
function pintaAvisoCresce() {
  celulasBox.querySelectorAll('.vai-crescer').forEach(e => e.classList.remove('vai-crescer'));
  if (J.alvoCresce) celulasBox.children[J.alvoCresce[0] * W + J.alvoCresce[1]].classList.add('vai-crescer');
}
function passoCrescer() {
  const f = faseAtual();
  if (!f.obj.cresce || J.fim) return;
  if (J.alvoCresce) {
    const [r, c] = J.alvoCresce;
    J.alvoCresce = null;
    if (papel[r][c] === 0) {
      papel[r][c] = 1; J.papelTotal++;
      pintaPapel();
      const casa = celulasBox.children[r * W + c];
      casa.classList.add('cresceu');
      setTimeout(() => casa.classList.remove('cresceu'), 520);
      Som.liga(); Som.cresce();
      atualizaHud();
    }
  }
  J.contaCresce = (J.contaCresce || 0) + 1;
  if (J.mov > 3 && casasCobertas(papel) > 0 && J.contaCresce % f.obj.cresce === 0) {
    const cand = [];
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++)
      if (papel[r][c] === 0 && J.papelBase[r][c] > 0) cand.push([r, c]);
    if (cand.length) J.alvoCresce = cand[sorteia(cand.length)];
  }
  pintaAvisoCresce();
}


/* ═══ PODERES NO TABULEIRO ══════════════════════════════════════
   O arpão tira uma peça e a troca livre junta duas que estão longe.
   Nenhum dos dois gasta jogada: o preço deles é o próprio poder.  */
let poderAtivo = null, poderAlvo = null;

async function usaPoderNaCelula(cel) {
  if (J.ocupado || J.fim) return;
  const p = grid[cel.r][cel.c];
  if (!p) return;

  if (poderAtivo === 'arpao') {
    if (p.bau) { Som.liga(); Som.nao(); faixaTexto('O baú não sai no arpão'); return; }
    gastaPoder('arpao');
    desligaPoder();
    J.ocupado = true;
    const el = els.get(p.id);
    if (el) el.classList.add('some');
    Som.liga(); Som.especial(); vibra(20);
    const alvoConj = new Set([chave(cel.r, cel.c)]);
    if (p.sp) expandir(alvoConj, null);      /* arpão em especial dispara ele */
    await limpar(alvoConj, null);
    await resolver(null, null);
    J.ocupado = false;
    await confere();
    reiniciaDica();
    return;
  }

  if (poderAtivo === 'troca') {
    if (!poderAlvo) { poderAlvo = cel; marca(cel); Som.troca(); return; }
    if (poderAlvo.r === cel.r && poderAlvo.c === cel.c) { limpaMarca(); poderAlvo = null; return; }
    const a = poderAlvo; poderAlvo = null; limpaMarca();
    gastaPoder('troca');
    desligaPoder();
    J.ocupado = true;
    const pa = grid[a.r][a.c], pb = grid[cel.r][cel.c];
    grid[a.r][a.c] = pb; grid[cel.r][cel.c] = pa;
    posiciona(els.get(pa.id), cel.r, cel.c); posiciona(els.get(pb.id), a.r, a.c);
    Som.liga(); Som.troca();
    await espera(230);
    let conj = null;
    if ((pa.sp === ARCO || pb.sp === ARCO) || (pa.sp && pb.sp)) {
      conj = comboTroca(cel.r, cel.c, a.r, a.c);
      for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (grid[r][c]) atualizaEl(grid[r][c]);
      faixaTexto('Combinação!');
      vibra(40);
    }
    await resolver(conj, [chave(cel.r, cel.c), chave(a.r, a.c)]);
    J.ocupado = false;
    await confere();
    reiniciaDica();
  }
}

/* redemoinho: embaralha sem gastar jogada */
async function giroAgora() {
  J.ocupado = true;
  desligaPoder();
  Som.liga(); Som.especial(); vibra(30);
  faixaTexto('Redemoinho!');
  embaralhaModelo();
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (grid[r][c]) atualizaEl(grid[r][c]);
  sincroniza('nasce');
  await espera(420);
  await resolver(null, null);
  J.ocupado = false;
  await confere();
  reiniciaDica();
}

/* ═══ DICA ══════════════════════════════════════════════════════ */
let dicaTimer = null, dicaAtiva = [];
function reiniciaDica() {
  apagaDica();
  clearTimeout(dicaTimer);
  if (J.fim) return;
  dicaTimer = setTimeout(mostraDica, 6000);
}
function mostraDica() {
  if (J.ocupado || J.fim) { reiniciaDica(); return; }
  const j = achaJogada(); if (!j) return;
  const alvos = [grid[j[0]][j[1]], grid[j[2]][j[3]]];
  for (const p of alvos) {
    if (!p) continue;
    const el = els.get(p.id);
    if (el) { el.classList.add('dica'); dicaAtiva.push(el); }
  }
}
function apagaDica() { dicaAtiva.forEach(e => e.classList.remove('dica')); dicaAtiva = []; }


/* ═══ HUD ═══════════════════════════════════════════════════════ */
const nf = n => n.toLocaleString('pt-BR');
let desafioAtual = null;
const faseAtual = () => J.desafio ? desafioAtual : fase(J.fase);
const icone = t => '<svg class="ic" viewBox="0 0 100 100"><use href="#s' + t + '"/></svg>';

function gastaJogada() {
  J.mov = Math.max(0, J.mov - 1);
  const m = document.getElementById('movimentos');
  m.classList.add('bate'); setTimeout(() => m.classList.remove('bate'), 400);
  atualizaHud();
  const aperto = J.mov <= 5 && J.mov > 0 && !J.fim;
  document.body.classList.toggle('aperto', aperto);
  if (aperto) { Som.liga(); Som.alerta(); vibra(TREMIDA.aperto); }
  Musica.tensao(aperto, 0);
}

function faltaObjetivo() {
  const f = faseAtual();
  if (f.obj.tipo === 'pontos') return Math.max(0, f.marcas[0] - J.pontos);
  if (f.obj.tipo === 'coletar') return f.obj.itens.reduce((a, it) => a + Math.max(0, it[1] - J.coletado[it[0]]), 0);
  if (f.obj.tipo === 'bau') return Math.max(0, f.obj.n - J.bauFeito);
  return Math.max(0, J.papelTotal - J.papelFeito);
}
function objetivoFeito() { return faltaObjetivo() === 0; }
function nomeBloq(f, n) { const b = MUNDOS[f.m].bloq; return n + ' ' + (n === 1 ? b.um : b.varios); }

function atualizaHud() {
  const f = faseAtual();
  document.getElementById('mov-n').textContent = J.mov;
  document.getElementById('mov-lb').textContent = J.mov === 1 ? 'jogada' : 'jogadas';
  document.getElementById('movimentos').classList.toggle('aperto', J.mov <= 5);
  animaPontos();

  const teto = f.marcas[2];
  document.getElementById('barra-cheio').style.width = Math.min(100, J.pontos / teto * 100) + '%';
  [0, 1, 2].forEach(i => {
    const m = document.getElementById('m' + (i + 1));
    const tem = J.pontos >= f.marcas[i], antes = m.dataset.on === '1';
    m.style.left = (f.marcas[i] / teto * 100) + '%';
    m.querySelector('use').setAttribute('href', tem ? '#i-estrela' : '#i-estrela-off');
    if (tem && !antes) {
      m.classList.remove('ganhou'); void m.offsetWidth; m.classList.add('ganhou');
      Som.liga(); Som.sobe(i); vibra(TREMIDA.estrela); clarao('rgba(255,211,92,.3)');
    }
    m.dataset.on = tem ? '1' : '0';
  });
  document.getElementById('meta-texto').textContent = J.pontos >= teto ? 'três estrelas!' : nf(teto) + ' para 3 estrelas';
  document.getElementById('fase-nome').textContent = f.nome;
  document.getElementById('fase-prof').textContent = f.desafio ? f.semana : metros(f.prof);

  const o = document.getElementById('objetivo');
  if (f.desafio) {
    o.innerHTML = '<div><div class="rotulo">Objetivo</div><div class="valor">o máximo de pontos</div></div>';
  } else if (f.obj.tipo === 'bau') {
    const falta = Math.max(0, f.obj.n - J.bauFeito);
    o.innerHTML = '<div><div class="rotulo">Descer até o fundo</div></div><div class="alvos">' +
      '<div class="alvo' + (falta ? '' : ' feito') + '"><svg class="ic" viewBox="0 0 100 100"><use href="#i-bau"/></svg><b>' + (falta || '✓') + '</b></div></div>';
  } else if (f.obj.tipo === 'pontos') {
    o.innerHTML = '<div><div class="rotulo">Objetivo</div><div class="valor">' + nf(f.marcas[0]) + ' pontos</div></div>';
  } else if (f.obj.tipo === 'coletar') {
    let s = '<div><div class="rotulo">Juntar</div></div><div class="alvos">';
    for (const it of f.obj.itens) {
      const falta = Math.max(0, it[1] - J.coletado[it[0]]);
      s += '<div class="alvo' + (falta ? '' : ' feito') + '">' + icone(it[0]) + '<b>' + (falta || '✓') + '</b></div>';
    }
    o.innerHTML = s + '</div>';
  } else {
    const falta = casasCobertas(papel);
    o.innerHTML = '<div><div class="rotulo">' + MUNDOS[f.m].bloq.verbo + '</div>' +
      '<div class="valor">' + (falta ? nomeBloq(f, falta) : 'tudo limpo ✓') + '</div></div>';
  }
}

let pontosNaTela = 0, pontosRaf = null;
function animaPontos() {
  const el = document.getElementById('pontos');
  if (Math.abs(J.pontos - pontosNaTela) < 1) { pontosNaTela = J.pontos; el.textContent = nf(J.pontos); pontosRaf = null; return; }
  pontosNaTela += (J.pontos - pontosNaTela) * 0.22 + 1;
  el.textContent = nf(Math.round(pontosNaTela));
  el.classList.add('sobe');
  clearTimeout(animaPontos.t);
  animaPontos.t = setTimeout(() => el.classList.remove('sobe'), 300);
  pontosRaf = requestAnimationFrame(animaPontos);
}

/* ═══ FIM DE FASE ═══════════════════════════════════════════════ */
async function confere() {
  if (J.fim) return;
  if (J.desafio) { if (J.mov <= 0) { J.fim = true; apagaDica(); clearTimeout(dicaTimer); fimDesafio(); } return; }
  const porPontos = faseAtual().obj.tipo === 'pontos';
  const fecha = f => { J.fim = true; apagaDica(); clearTimeout(dicaTimer); return f(); };
  /* fase de pontuação joga até a última jogada: é lá que moram a 2ª e a 3ª estrela */
  if (porPontos) {
    if (J.mov <= 0) return fecha(objetivoFeito() ? venceu : perdeu);
    return;
  }
  if (objetivoFeito()) return fecha(venceu);
  if (J.mov <= 0) return fecha(perdeu);
}

async function venceu() {
  J.ocupado = true;
  if (J.mov > 0) {
    faixaTexto('Sobrou jogada!');
    await espera(500);
    const passos = Math.min(J.mov, 10), porPasso = Math.ceil(J.mov / passos);
    while (J.mov > 0) {
      const usa = Math.min(porPasso, J.mov);
      J.mov -= usa; J.pontos += 250 * usa;
      Som.liga(); Som.pop(4);
      respingos(sorteia(H), sorteia(W), corDe(sorteia(TIPOS)), 7);
      atualizaHud();
      await espera(110);
    }
    await espera(280);
  }
  const f = faseAtual();
  let e = 1;
  if (J.pontos >= f.marcas[1]) e = 2;
  if (J.pontos >= f.marcas[2]) e = 3;
  const primeira = !prog.estrelas[J.fase];
  limpaPartida();
  prog.estrelas[J.fase] = Math.max(prog.estrelas[J.fase] || 0, e);
  if (J.fase + 1 > prog.max) prog.max = J.fase + 1;
  const ganho = moedasDaFase(e, primeira);
  prog.moedas += ganho;
  salvaProg();
  pintaMoedas();

  const frases = ['Passou, mas no último fôlego.', 'Mergulho bonito.', 'Impecável. Nem levantou areia.'];
  const fimExp = (J.fase + 1) % CICLO === 0;
  const prox = fase(J.fase + 1);
  const muda = !fimExp && prox.m !== f.m;
  cartao(
    '<h3>' + (fimExp ? 'Você chegou ao fundo' : 'Fase concluída!') + '</h3>' +
    '<div class="estrelas-grandes">' +
      [0, 1, 2].map(i => '<div class="e' + (i < e ? ' on' : '') + '" style="animation-delay:' + (i * .22) + 's"><svg viewBox="0 0 100 100"><use href="#' + (i < e ? 'i-estrela' : 'i-estrela-off') + '"/></svg></div>').join('') +
    '</div>' +
    '<p class="placar-final">' + nf(J.pontos) + '<small>pontos</small></p>' +
    '<p class="ganho-moedas"><svg viewBox="0 0 100 100"><use href="#i-moeda"/></svg>+' + ganho + '</p>' +
    '<p>' + (fimExp ? 'Foram 4.000 metros. A Expedição ' + expedicao(J.fase + 1) + ' começa de novo no raso, mais apertada.'
             : muda ? frases[e - 1] + ' Daqui pra baixo começa o ' + MUNDOS[prox.m].nome + '.' : frases[e - 1]) + '</p>' +
    '<div class="bts">' +
      '<button class="bt vidro" data-ac="mapa">Mapa</button>' +
      '<button class="bt" data-ac="proxima">' + (fimExp ? 'Nova expedição' : muda ? 'Descer para o ' + MUNDOS[prox.m].nome : 'Próxima fase') + '</button>' +
    '</div>'
  );
  Som.liga(); Som.vitoria();
  document.body.classList.remove('aperto');
  Musica.tensao(false, 0);
  fogos(2 + e * 2);
  for (let i = 0; i < e; i++) setTimeout(() => { Som.estrela(i); vibra(TREMIDA.estrela); }, 260 + i * 220);
  vibra(TREMIDA.vitoria);
}

/* ═══ DESAFIO DA SEMANA ════════════════════════════════════════
   Mesma semente para todo mundo na semana: o tabuleiro e a ordem
   das peças novas são iguais, ganha quem jogar melhor.           */
const Placar = {
  url: '',   /* URL do Realtime Database, ex.: https://seu-projeto.firebaseio.com — vazio, o ranking fica só no aparelho */
  id: null,
  async envia(nome, pontos, semana) {
    if (!this.url || !nome) return;
    try {
      this.id = this.id || Math.random().toString(36).slice(2, 10);
      await fetch(this.url + '/mergulho/' + semana + '/' + this.id + '.json',
        { method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome: nome, pontos: pontos, quando: Date.now() }) });
    } catch (e) { /* sem rede: o recorde continua salvo aqui */ }
  },
  async lista(semana) {
    if (!this.url) return null;
    try {
      const r = await fetch(this.url + '/mergulho/' + semana + '.json');
      const d = await r.json();
      return Object.values(d || {}).sort((a, b) => b.pontos - a.pontos).slice(0, 20);
    } catch (e) { return null; }
  }
};
function melhorDaSemana(f) { return prog.desafio.semana === f.semana ? prog.desafio.melhor : 0; }
function mostraDesafio() {
  const f = faseDesafio(), melhor = melhorDaSemana(f);

    '<p>O mesmo tabuleiro para todo mundo até domingo. São 25 jogadas e vale quem fizer mais ponto.</p>' +
    '<p class="melhor">' + (melhor ? 'Seu melhor: ' + nf(melhor) : 'Você ainda não jogou esta semana.') + '</p>' +
    '<div class="bts"><button class="bt vidro" data-ac="fecha">Agora não</button>' +
    '<button class="bt" data-ac="desafio">Jogar</button></div>');
}
function abreDesafio() {
  const f = faseDesafio();
  desafioAtual = f;
  semeiaJogo(f.semana);
  instalaMundo(f.m);
  J = { fase: -1, desafio: true, mov: f.mov, pontos: 0, coletado: [0, 0, 0, 0, 0, 0],
        papelTotal: 0, papelFeito: 0, ocupado: true, fim: false, cascata: 1,
        bauFeito: 0, bauNaTela: 0, bauPendentes: 0, contaCresce: 0, alvoCresce: null };
  papel = Array.from({ length: H }, () => Array(W).fill(0));

async function fimDesafio() {
  J.fim = true; J.ocupado = true;

/* ═══ AJUSTES E DESEMPENHO ═════════════════════════════════════
   Aparelho fraco não some com o jogo: entra o modo leve, que tira
   desfoque, partícula e brilho e deixa o essencial.              */
function aplicaLeve() { document.body.classList.toggle('leve', !!prog.leve); }
function decideLeve() {
  if (prog.leve !== null && prog.leve !== undefined) return;
  const nucleos = navigator.hardwareConcurrency || 4;
  const memoria = navigator.deviceMemory || 4;
  prog.leve = nucleos <= 4 && memoria <= 4;   /* na dúvida entra cheio: o vigia de fps corrige depois */
  salvaProg();
}
let olhoFps = null, jaMediu = false;
function vigiaFps() {
  if (jaMediu || prog.leve) return;
  jaMediu = true;
  let quadros = 0;
  const t0 = performance.now();
  const passo = () => {
    quadros++;
    const dt = performance.now() - t0;
    if (dt < 4000) { olhoFps = requestAnimationFrame(passo); return; }
    olhoFps = null;
    if (quadros / (dt / 1000) < 38) {
      prog.leve = true; salvaProg(); aplicaLeve();
      faixaTexto('Modo leve');
      setTimeout(() => cartao('<h3>Liguei o modo leve</h3>' +
        '<p>O jogo estava engasgando neste aparelho, então tirei desfoque, partícula e brilho pra rodar liso. Dá pra voltar atrás nos ajustes, no botão de engrenagem da tela inicial.</p>' +
        '<div class="bts"><button class="bt" data-ac="fecha">Beleza</button></div>'), 900);
    }
  };
  olhoFps = requestAnimationFrame(passo);
}

function noDoMapa(i) {

  const trio = (!travada && est) ? '<span class="trio">' + [0, 1, 2].map(q => '<svg viewBox="0 0 100 100"><use href="#' + (q < est ? 'i-estrela' : 'i-estrela-off') + '"/></svg>').join('') + '</span>' : '';

/* o mapa mostra uma janela de fases: com dez mil nós na tela o
   celular não aguentaria, então desenha em volta de onde você está */
function montaMapa(mantem) {
  const col = document.getElementById('coluna'), trilha = document.getElementById('trilha');
  const altaAntes = col.scrollHeight;
  if (!mantem) mapaIni = Math.max(0, prog.max - 17);
  const fim = prog.max + 6;
  let h = '<svg class="trilha-svg" id="trilha-bolhas" aria-hidden="true"></svg>';
  if (mapaIni > 0) h += '<button class="subir" id="bt-subir">Subir para as fases anteriores</button>';
  for (let b = Math.floor(mapaIni / 6); b <= Math.floor(fim / 6); b++) {
    const i0 = b * 6, mundo = Math.floor((i0 % CICLO) / 6), mu = MUNDOS[mundo];
    if (i0 % CICLO === 0 && i0 >= mapaIni) h += superficieMapa(expedicao(i0));
    h += '<section class="faixa-mundo" data-m="' + mundo + '">' +
         '<header class="cab-mundo"><h3>' + mu.nome + '</h3><p>' + metros(mu.de) + ' a ' + metros(mu.ate) + '</p></header>';
    for (let i = Math.max(i0, mapaIni); i <= Math.min(i0 + 5, fim); i++) h += noDoMapa(i);
    h += '</section>';
    if ((i0 + 5) % CICLO === CICLO - 1 && i0 + 5 <= fim) h += leitoMapa();
  }
  col.innerHTML = h;
  col.querySelectorAll('.no').forEach(b => b.onclick = () => {
    const n = +b.dataset.i;
    Som.liga();
    if (n > prog.max) { b.animate([{ transform: b.style.transform }, { transform: b.style.transform + ' translateX(-7px)' }, { transform: b.style.transform + ' translateX(7px)' }, { transform: b.style.transform }], 260); Som.nao(); return; }
    abreFase(n);
  });
  const subir = document.getElementById('bt-subir');
  if (subir) subir.onclick = () => {
    Som.liga();
    const antes = col.scrollHeight;
    mapaIni = Math.max(0, mapaIni - 18);
    montaMapa(true);
    requestAnimationFrame(() => { trilha.scrollTop += col.scrollHeight - antes; });
  };
  document.getElementById('total-estrelas').textContent = totalEstrelas();
  pintaMoedas();
  requestAnimationFrame(() => { desenhaTrilha(); if (!mantem) rolaAteAtual(); });
}

function desenhaTrilha() {
  const col = document.getElementById('coluna'), svg = document.getElementById('trilha-bolhas');
  if (!col || !svg) return;
  const nos = [...col.querySelectorAll('.no')];
  if (!nos.length) return;
  const base = col.getBoundingClientRect(), w = base.width, h = col.scrollHeight;
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  svg.style.height = h + 'px';
  const pts = nos.map(b => { const r = b.getBoundingClientRect(); return [r.left - base.left + r.width / 2, r.top - base.top + r.height / 2]; });
  let d = 'M' + pts[0][0].toFixed(1) + ' ' + Math.max(0, pts[0][1] - 110).toFixed(1) + ' L' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], my = (a[1] + b[1]) / 2;
    d += ' C' + a[0].toFixed(1) + ' ' + my.toFixed(1) + ' ' + b[0].toFixed(1) + ' ' + my.toFixed(1) + ' ' + b[0].toFixed(1) + ' ' + b[1].toFixed(1);
  }
  /* até onde você já desceu a trilha fica acesa */
  const ate = Math.min(prog.max - mapaIni, pts.length - 1);
  let dFeito = ate < 0 ? '' : 'M' + pts[0][0].toFixed(1) + ' ' + Math.max(0, pts[0][1] - 110).toFixed(1) + ' L' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for (let i = 1; i <= ate; i++) {
    const a = pts[i - 1], b = pts[i], my = (a[1] + b[1]) / 2;
    dFeito += ' C' + a[0].toFixed(1) + ' ' + my.toFixed(1) + ' ' + b[0].toFixed(1) + ' ' + my.toFixed(1) + ' ' + b[0].toFixed(1) + ' ' + b[1].toFixed(1);
  }
  svg.innerHTML =
    '<path d="' + d + '" fill="none" stroke="rgba(243,251,255,.28)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 15"/>' +
    '<path d="' + dFeito + '" fill="none" stroke="#F3FBFF" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 15" opacity=".85"/>';
}

function rolaAteAtual() {
  const trilha = document.getElementById('trilha'), atual = document.querySelector('#coluna .no.atual') || document.querySelectorAll('#coluna .no')[prog.max];
  if (!trilha || !atual) return;
  const alvo = atual.getBoundingClientRect().top - trilha.getBoundingClientRect().top + trilha.scrollTop - trilha.clientHeight / 2 + 40;
  /* chega perto na hora e desce o último pedaço devagar: a descida é o gesto do jogo */
  trilha.scrollTop = Math.max(0, alvo - 180);
  requestAnimationFrame(() => trilha.scrollTo({ top: Math.max(0, alvo), behavior: 'smooth' }));
}

/* ═══ ABRIR UMA FASE ════════════════════════════════════════════ */
function retomaPartida(d) {
  const f = fase(d.f);
  instalaMundo(f.m);
  J = { fase: d.f, mov: d.mov, pontos: d.pontos, coletado: d.col,
        papelTotal: d.pt, papelFeito: d.pf, ocupado: true, fim: false, cascata: 1,
        bauFeito: d.bf, bauNaTela: d.bn, bauPendentes: d.bp, contaCresce: d.cc, alvoCresce: d.ac,
        papelBase: d.base };
  papel = d.papel;
  uid = 0;
  grid = d.g.map(l => l.map(cod => {
    if (!cod) return null;
    if (cod === 'b') return novoBau();
    const pd = cod.split('.');
    const p = novaPeca(+pd[0]); p.sp = +pd[1]; return p;
  }));
  pontosNaTela = 0;
  fechaCartao();
  tela('tela-jogo');
  requestAnimationFrame(() => {
    montaCasas(); dimensiona(); montaPecas(); atualizaHud(); desligaPoder();
    mesa.classList.toggle('com-bau', f.obj.tipo === 'bau');
    pintaPapel();
    if (J.alvoCresce) pintaAvisoCresce();
    J.ocupado = false;
    reiniciaDica();
    Som.liga(); Som.sobe(0);
    Musica.liga('jogo', mundoAtual);
    faixaTexto('De volta');
  });
}

function abreFase(i) {
  limpaPartida();
  const f = fase(i);
  instalaMundo(f.m);
  soltaSemente();
  J = { fase: i, mov: f.mov, pontos: 0, coletado: [0, 0, 0, 0, 0, 0],
        papelTotal: 0, papelFeito: 0, ocupado: true, fim: false, cascata: 1,
        bauFeito: 0, bauNaTela: 0, bauPendentes: f.obj.tipo === 'bau' ? f.obj.n : 0,
        contaCresce: 0, alvoCresce: null };
  papel = (f.obj.tipo === 'papel') ? fazPapel(f.obj.padrao, f.obj.camadas)
                                   : Array.from({ length: H }, () => Array(W).fill(0));
  J.papelBase = papel.map(l => l.slice());
  J.papelTotal = contaPapel(papel);
  pontosNaTela = 0;
  montaTabuleiro();
  fechaCartao();
  tela('tela-jogo');
  requestAnimationFrame(() => {
    montaCasas();
    dimensiona();
    montaPecas();
    atualizaHud();
    desligaPoder();
    mesa.classList.toggle('com-bau', f.obj.tipo === 'bau');
    if (!prog.vistos[f.m]) { prog.vistos[f.m] = true; salvaProg(); mostraMundo(f.m); }
    else comecaFase();
  });
}
function comecaFase() {
  const f = faseAtual();
  if (!prog.vistos.bau && f.obj.tipo === 'bau') { prog.vistos.bau = true; salvaProg(); return mostraAviso('O baú', '#i-bau',
    'O baú só quer chegar na última fileira. Ele não combina com nada e especial nenhum leva ele embora. Estoure as peças debaixo dele, ou empurre ele de lado, que ele afunda sozinho.'); }
  if (!prog.vistos.cresce && f.obj.cresce) { prog.vistos.cresce = true; salvaProg(); return mostraAviso('A alga volta', null,
    'Nesta fase a alga cresce de novo se você demorar. A casa que vai voltar pisca antes, então dá pra chegar na frente. Nas últimas jogadas ela para de crescer.'); }
  J.ocupado = false;
  reiniciaDica();
  Som.liga(); Som.sobe(0);
  Musica.liga('jogo', mundoAtual);
  vigiaFps();
  if (f.desafio) faixaTexto('25 jogadas'); else faixaTexto(metros(f.prof));
}
function mostraAviso(titulo, icone, texto) {
  cartao('<h3>' + titulo + '</h3>' +
    (icone ? '<div class="vitrine-mini"><svg class="ic" viewBox="0 0 100 100"><use href="' + icone + '"/></svg></div>' : '') +
    '<p>' + texto + '</p>' +
    '<div class="bts"><button class="bt" data-ac="comeca">Entendi</button></div>');
}

/* ═══ SOM: BOTÃO ════════════════════════════════════════════════ */
function pintaBotaoSom() {
  const b = document.getElementById('bt-som');
  b.innerHTML = prog.som
    ? '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>';
  b.setAttribute('aria-label', prog.som ? 'Desligar o som' : 'Ligar o som');
}

/* ═══ ARRANQUE ══════════════════════════════════════════════════ */
function iniciar() {
  mesa = document.getElementById('mesa');
  celulasBox = document.getElementById('celulas');
  pecasBox = document.getElementById('pecas');
  faiscasBox = document.getElementById('faiscas');

  carregaProg();
  decideLeve();
  aplicaLeve();
  document.getElementById('versao').textContent = 'v' + VERSAO_JOGO;
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('.bt, .ico-bt, .poder, .no, .bt-compra, .subir')) { Som.liga(); Som.toque(); }
  }, true);
  pintaBotaoSom();
  pintaMoedas();
  pintaPoderes();
  instalaMundo(fase(prog.max).m);
  tela('tela-inicio');

  document.getElementById('bt-jogar').onclick = () => { Som.liga(); montaMapa(); tela('tela-mapa'); };
  document.getElementById('bt-ajuda').onclick = () => { Som.liga(); mostraAjuda(); };
  document.getElementById('bt-mapa-volta').onclick = () => { instalaMundo(fase(prog.max).m); tela('tela-inicio'); };
  document.getElementById('bt-jogo-volta').onclick = () => { soltaSemente(); fechaCartao(); montaMapa(); tela('tela-mapa'); };
  document.getElementById('bt-ajustes').onclick = () => { Som.liga(); mostraAjustes(); };
  document.getElementById('bt-desafio').onclick = () => { Som.liga(); mostraDesafio(); };
  document.getElementById('bt-loja').onclick = () => { Som.liga(); mostraLoja(); };
  document.getElementById('poderes').addEventListener('click', e => {
    const b = e.target.closest('[data-p]');
    if (b) clicaPoder(b.dataset.p);
  });
  document.getElementById('bt-som').onclick = () => {
    prog.som = !prog.som; salvaProg(); pintaBotaoSom();
    if (prog.som) { Som.liga(); Som.pop(3); Musica.liga(document.body.classList.contains('em-jogo') ? 'jogo' : 'menu', mundoAtual); }
    else Musica.para();
  };

  document.getElementById('veu').addEventListener('click', e => {
    const b = e.target.closest('[data-ac]');
    if (!b) { if (e.target.id === 'veu' && document.querySelector('#cartao .ajuda')) fechaCartao(); return; }
    const ac = b.dataset.ac;
    Som.liga();
    if (ac === 'fecha') fechaCartao();
    else if (ac === 'compra') compra(b.dataset.id);
    else if (ac === 'bau') pegaBau();
    else if (ac === 'desafio') abreDesafio();
    else if (ac === 'compartilha') compartilhaDesafio(b);
    else if (ac === 'mudar') mudaAjuste(b.dataset.k);
    else if (ac === 'retoma') { const d = lePartida(); limpaPartida(); if (d) retomaPartida(d); else fechaCartao(); }
    else if (ac === 'descarta') { limpaPartida(); fechaCartao(); if (prog.dia !== hoje()) setTimeout(mostraBau, 300); }
    else if (ac === 'folego') usaFolegoNoCartao();
    else if (ac === 'comeca') { fechaCartao(); comecaFase(); }
    else if (ac === 'mapa') { fechaCartao(); montaMapa(); tela('tela-mapa'); }
    else if (ac === 'denovo') abreFase(J.fase);
    else if (ac === 'proxima') abreFase(J.fase + 1);
  });

  mesa.addEventListener('pointerdown', aoPressionar);
  mesa.addEventListener('pointermove', aoMover);
  mesa.addEventListener('pointerup', aoSoltar);
  mesa.addEventListener('pointercancel', () => { arrasto = null; });
  mesa.addEventListener('contextmenu', e => e.preventDefault());

  let t = null;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (document.getElementById('tela-jogo').classList.contains('ativa')) dimensiona();
      if (document.getElementById('tela-mapa').classList.contains('ativa')) desenhaTrilha();
    }, 140);
  });

  papel = Array.from({ length: H }, () => Array(W).fill(0));
  grid = Array.from({ length: H }, () => Array(W).fill(null));

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { salvaPartida(); Musica.para(); clearTimeout(dicaTimer); apagaDica(); if (olhoFps) { cancelAnimationFrame(olhoFps); olhoFps = null; } }
    else if (prog.som && prog.musica) Musica.liga(document.body.classList.contains('em-jogo') ? 'jogo' : 'menu', mundoAtual);
  });

  const parada = lePartida();
  if (parada && fase(parada.f)) {
    setTimeout(() => cartao('<h3>Você parou no meio</h3>' +
      '<p>A fase ' + (parada.f + 1) + ' ficou pela metade, com ' + parada.mov + (parada.mov === 1 ? ' jogada' : ' jogadas') + ' e ' + nf(parada.pontos) + ' pontos. Quer voltar pra ela?</p>' +
      '<div class="bts"><button class="bt vidro" data-ac="descarta">Começar de novo</button>' +
      '<button class="bt" data-ac="retoma">Continuar</button></div>'), 500);
  } else if (prog.dia !== hoje()) setTimeout(mostraBau, 700);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
else iniciar();

</script>

<script>
/* service worker: só no https (ou localhost), nunca em file:// */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
    let recarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recarregou) return;
      recarregou = true;
      location.reload();
    });
  });
}
</script>
